<title>Software Fleet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 1 列のスマホ画面: 上の濃い帯（依頼と件数）、本体（8 つの ship のパネルと一覧）、下の濃い帯（親指で操作する、あなたの番）。色は藍鉄と浅葱。面の彩度は低く、色の面は押すものと あなたの番 だけ */
:root{
  --bg:oklch(0.955 0.006 240);--dim:oklch(0.925 0.009 240);--surface:oklch(0.995 0.0024 240);--fg:oklch(0.25 0.021 240);--muted:oklch(0.48 0.018 240);
  --line:oklch(0.87 0.009 240);--acc:oklch(0.42 0.06 240);--on-acc:oklch(0.98 0.003 240);
  --chrome:oklch(0.27 0.03 240);--on-chrome:oklch(0.97 0.006 240);--on-chrome2:oklch(0.8 0.015 240);--pas:oklch(0.4 0.045 240);--on-pas:oklch(0.98 0.003 240);--on-pas2:oklch(0.86 0.018 240);
  --fill:oklch(0.74 0.075 205);--on-fill:oklch(0.2 0.024 240);
  --work:oklch(0.5 0.05 240);--review:oklch(0.5 0.07 75);--done:oklch(0.47 0.06 165);--stuck:oklch(0.5 0.13 30);--wait:oklch(0.78 0.008 240);
  --shadow:oklch(0.25 0.02 240 / .08);--scrim:oklch(0.2 0.02 240 / .4);
  --em-rm:oklch(0.5 0.07 165);--em-cmd:oklch(0.5 0.07 240);--em-ev:oklch(0.58 0.09 65);--em-pol:oklch(0.5 0.07 305);
  --em-rm-bg:oklch(0.89 0.035 165);--em-cmd-bg:oklch(0.88 0.035 240);--em-ev-bg:oklch(0.88 0.055 75);--em-pol-bg:oklch(0.93 0.02 305);
  --em-hot:oklch(0.55 0.09 355);--em-hot-bg:oklch(0.93 0.03 355);
  --cm-edge:oklch(0.62 0.02 240);--cm-api:oklch(0.5 0.15 315);--cm-db:oklch(0.5 0.13 245);--cm-add:oklch(0.5 0.1 155);--cm-mod:oklch(0.52 0.11 65);--cm-add-bg:oklch(0.94 0.05 155);--cm-mod-bg:oklch(0.94 0.06 85);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Hiragino Sans","Yu Gothic UI",Meiryo,monospace; /* 英数は等幅、日本語は本文と同じ字（Windows で MS ゴシックに落とさない） */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.21 0.018 240);--dim:oklch(0.25 0.021 240);--surface:oklch(0.3 0.024 240);--fg:oklch(0.94 0.006 240);--muted:oklch(0.76 0.015 240);
  --line:oklch(0.35 0.021 240);--acc:oklch(0.8 0.08 240);--on-acc:oklch(0.2 0.024 240);
  --chrome:oklch(0.16 0.018 240);--on-chrome:oklch(0.96 0.006 240);--on-chrome2:oklch(0.76 0.015 240);--pas:oklch(0.42 0.045 240);--on-pas:oklch(0.98 0.003 240);--on-pas2:oklch(0.86 0.018 240);
  --fill:oklch(0.74 0.075 205);--on-fill:oklch(0.2 0.024 240);
  --work:oklch(0.76 0.06 240);--review:oklch(0.78 0.08 75);--done:oklch(0.76 0.07 165);--stuck:oklch(0.76 0.11 35);--wait:oklch(0.42 0.01 240);
  --shadow:oklch(0 0 0 / .35);--scrim:oklch(0 0 0 / .5);color-scheme:dark;
  --em-rm:oklch(0.74 0.07 165);--em-cmd:oklch(0.74 0.07 240);--em-ev:oklch(0.78 0.08 70);--em-pol:oklch(0.74 0.07 305);
  --em-rm-bg:oklch(0.36 0.04 165);--em-cmd-bg:oklch(0.36 0.04 240);--em-ev-bg:oklch(0.4 0.05 70);--em-pol-bg:oklch(0.32 0.03 305);
  --em-hot:oklch(0.76 0.07 355);--em-hot-bg:oklch(0.35 0.04 355);
  --cm-edge:oklch(0.55 0.02 240);--cm-api:oklch(0.8 0.11 315);--cm-db:oklch(0.8 0.09 240);--cm-add:oklch(0.78 0.11 155);--cm-mod:oklch(0.8 0.1 75);--cm-add-bg:oklch(0.34 0.05 155);--cm-mod-bg:oklch(0.36 0.05 80)}}
:root[data-theme="dark"]{
  --bg:oklch(0.21 0.018 240);--dim:oklch(0.25 0.021 240);--surface:oklch(0.3 0.024 240);--fg:oklch(0.94 0.006 240);--muted:oklch(0.76 0.015 240);
  --line:oklch(0.35 0.021 240);--acc:oklch(0.8 0.08 240);--on-acc:oklch(0.2 0.024 240);
  --chrome:oklch(0.16 0.018 240);--on-chrome:oklch(0.96 0.006 240);--on-chrome2:oklch(0.76 0.015 240);--pas:oklch(0.42 0.045 240);--on-pas:oklch(0.98 0.003 240);--on-pas2:oklch(0.86 0.018 240);
  --fill:oklch(0.74 0.075 205);--on-fill:oklch(0.2 0.024 240);
  --work:oklch(0.76 0.06 240);--review:oklch(0.78 0.08 75);--done:oklch(0.76 0.07 165);--stuck:oklch(0.76 0.11 35);--wait:oklch(0.42 0.01 240);
  --shadow:oklch(0 0 0 / .35);--scrim:oklch(0 0 0 / .5);color-scheme:dark;
  --em-rm:oklch(0.74 0.07 165);--em-cmd:oklch(0.74 0.07 240);--em-ev:oklch(0.78 0.08 70);--em-pol:oklch(0.74 0.07 305);
  --em-rm-bg:oklch(0.36 0.04 165);--em-cmd-bg:oklch(0.36 0.04 240);--em-ev-bg:oklch(0.4 0.05 70);--em-pol-bg:oklch(0.32 0.03 305);
  --em-hot:oklch(0.76 0.07 355);--em-hot-bg:oklch(0.35 0.04 355);
  --cm-edge:oklch(0.55 0.02 240);--cm-api:oklch(0.8 0.11 315);--cm-db:oklch(0.8 0.09 240);--cm-add:oklch(0.78 0.11 155);--cm-mod:oklch(0.8 0.1 75);--cm-add-bg:oklch(0.34 0.05 155);--cm-mod-bg:oklch(0.36 0.05 80)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glance{flex:1;min-height:0;overflow-y:auto;padding-block:18px 12px;display:flex;flex-direction:column;gap:10px}
.req{margin:0;font-size:14px;line-height:1.5;font-weight:700;text-wrap:balance}
.req.wait{color:var(--muted);font-weight:400}
.band{display:flex;flex-direction:column;gap:4px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:18px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--chrome);color:var(--on-chrome)}
.band .req{font-size:17px;line-height:24px;font-weight:600}
.band .req.wait,.band .warn{color:var(--on-chrome2);font-weight:400}
.sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sum{display:flex;align-items:baseline;gap:6px;min-height:44px;padding-top:8px;font-size:12px;color:var(--on-chrome2)}
.sum b{font-size:22px;line-height:28px;font-weight:600;color:var(--on-chrome);font-variant-numeric:tabular-nums}
.glance:has(> .band){padding-top:0}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px}
.tile{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;align-items:center;height:52px;padding:0 10px;border-radius:3px;background:var(--dim);color:var(--fg)}
.tile .tx{display:flex;flex-direction:column;min-width:0}
.tile b{font-size:14px;line-height:20px;font-weight:400;white-space:nowrap}
.tile small{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.work{background:var(--surface);box-shadow:0 1px 2px var(--shadow)}
.tile.turn{background:var(--pas);color:var(--on-pas)}
.tile.turn b,.tile.stuck b{font-weight:600}
.tile.turn small{color:var(--on-pas2)}
.tile.stuck{background:var(--surface);color:var(--stuck);box-shadow:0 1px 2px var(--shadow)}
.tile.stuck small{color:var(--stuck)}
.gly{display:block;width:24px;height:24px;flex:none}
.spin{transform-origin:12px 12px;animation:xspin 1.4s linear infinite}
@keyframes xspin{to{transform:rotate(360deg)}}
.h2{font-size:14px;font-weight:700}
.cnt{font-size:12px;color:var(--muted)}
.ships{display:flex;flex-direction:column}
.shiph{display:flex;align-items:baseline;gap:8px;padding-bottom:6px}
.legend{margin-left:auto;font-size:11px;color:var(--muted)}
.ship{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sr{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--wait)}
.s-working{background:var(--work)}.s-review{background:var(--review)}.s-converged{background:var(--done)}.s-stuck{background:var(--stuck)}.s-waiting,.s-none{background:var(--wait)}
.sname{font-size:13px;font-weight:700}
.st{font-size:11.5px;color:var(--muted)}
.go{margin-left:auto;font-size:18px;line-height:1;color:var(--muted)}
.snote{font-size:11.5px;line-height:1.5;color:var(--muted);padding-left:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{flex:none;width:52px;height:44px;display:flex;align-items:center;justify-content:center}
.trk{position:relative;width:40px;height:24px;border-radius:12px;background:var(--line)}
.knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on .trk{background:var(--fg)}
.sw.on .knob{left:19px}
/* あなたが判断すること・残りの塊・仮定: 一覧で見渡し、押すとドックのその件か付箋へ */
.yt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 0;border-top:1px solid var(--line)}
.ytk{flex:none;width:52px;text-align:center;font-size:10.5px;font-weight:700;line-height:18px;border-radius:3px}
.k-ask{background:var(--acc);color:var(--on-acc)}
.k-review{background:color-mix(in oklch,var(--review) 35%,transparent);color:var(--fg)}
.k-hot{background:var(--em-hot-bg);box-shadow:inset 0 0 0 1px var(--em-hot)}
.ytt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45;font-weight:700}
.ytt>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ytt small{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lfn{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.lfn.on{background:var(--acc);color:var(--on-acc);box-shadow:none}
.lfb{display:flex;flex-direction:column;min-width:0}
.lft{font-size:13px;line-height:1.55;font-weight:700;padding-top:1px;overflow-wrap:anywhere}
.lfw{display:flex;align-items:center;min-height:36px;max-width:100%;font-size:11.5px;font-weight:700;color:var(--acc)}
.lfw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;align-items:center;min-height:44px;gap:8px}
.log summary::-webkit-details-marker{display:none}
.log summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px}
.logi{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.lt{font-size:13px;font-weight:700}
.lw{font-size:12px;color:var(--muted)}
.le{font-size:11px;font-family:var(--mono);color:var(--muted);word-break:break-all;text-decoration:none}
a.le{color:var(--acc)}
.dock{--bg:var(--chrome);--fg:var(--on-chrome);--muted:var(--on-chrome2);--line:var(--on-chrome2);--acc:var(--on-chrome);--surface:var(--chrome);position:relative;flex:none;display:flex;flex-direction:column;gap:6px;padding-top:12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--chrome);color:var(--fg)}
.nav{position:absolute;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:1;display:flex;align-items:center}
.arrow{width:36px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;text-align:center}
.arrow.off{opacity:.25;pointer-events:none}
.navc{display:flex;flex-direction:column;align-items:center;gap:4px}
.navt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;align-items:stretch}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qbtn{display:block;width:100%}
.slk{display:flex;gap:16px;align-items:center;min-height:32px;font-size:13px}
.slk button{min-height:32px}
.slide:not(:has(.slk))::after{content:"";flex:none;height:32px}
.dq{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;line-height:24px;font-weight:600;text-wrap:pretty}
.more{font-size:12px;font-weight:700;color:var(--acc)}
.dw{font-size:12px;line-height:1.6;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:2px}
.act{display:flex;flex-direction:column;justify-content:center;gap:1px;width:100%;min-height:48px;padding:5px 14px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);transition:opacity .12s;min-width:0}
.act.pri{background:var(--fill);color:var(--on-fill);box-shadow:none}
.act.free{min-height:44px;flex-direction:row;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700}
.act.free span{border-bottom:1px dashed currentColor}
.locked .act,.locked .qbtn{pointer-events:none}
.locked .act{opacity:.55}
.al{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;line-height:1.3;min-width:0}
.ae{font-size:11px;line-height:1.35;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atag{flex:none;font-size:12px;font-weight:400}
.ft{width:100%;min-height:96px;padding:10px 12px;border-radius:3px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;line-height:1.5;resize:none}
.ft:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.ftrow{display:grid;grid-template-columns:96px 1fr;gap:8px}
.fb{min-height:48px;border-radius:3px;font-size:14px;font-weight:700;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.fb.pri{background:var(--fill);color:var(--on-fill);box-shadow:none}
.rship{font-size:20px;font-weight:700}
.dmsg{font-size:15px;font-weight:700;line-height:1.5;word-break:break-all}
.dsub{font-size:12px;color:var(--muted)}
.warn{font-size:12px;line-height:1.5;color:var(--stuck)}
.undo{min-height:52px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--fg);font-size:15px;font-weight:700;text-align:center;margin-top:auto}
.tbar{height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.tfill{height:100%;background:var(--fg);transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.dnone{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.dnone .cnt{margin-left:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{height:90%;display:flex;flex-direction:column;background:var(--bg);border-radius:12px 12px 0 0;overflow:hidden}
.sbody{flex:1;min-height:0;overflow-y:auto;padding-block:18px 12px;display:flex;flex-direction:column;gap:14px}
.sq{font-size:16px;line-height:1.5;font-weight:700}
.sec2{display:flex;flex-direction:column;gap:8px}
.sh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc)}
.stxt{font-size:13px;line-height:1.7;text-wrap:pretty;white-space:pre-wrap}
.fig{max-width:100%;overflow-x:auto;border-radius:3px}
.opt2{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:3px;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-width:0}
.ot{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.otag{font-size:11px;padding:1px 8px;border-radius:3px;background:var(--acc);color:var(--on-acc)}
.oc{font-size:12px;color:var(--muted)}
.evw{overflow-x:auto}
.ev{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;background:var(--surface);border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ev th,.ev td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.35;word-break:break-all}
.ev .ax{width:70px}
.ev .rec{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.w{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.mk{display:block;font-size:15px;font-weight:700;line-height:1.2}
.nt{display:block;color:var(--muted);font-size:10.5px}
.sfoot{flex:none;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.close{width:100%;min-height:52px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:700;text-align:center}
.back{font-size:13px;font-weight:700;color:var(--acc);min-height:44px;display:flex;align-items:center}
.big{font-size:20px;font-weight:700}
/* requirement: 要求を 1 文で読む。印は別の列に置き、折り返しても文の左端をそろえる。文節で折り返す（lang="ja" が要る） */
.rhead{display:flex;align-items:center;gap:6px;min-height:44px;font-size:16px;font-weight:700}
.rhead span{font-size:20px;font-weight:400;color:var(--muted)}
.rkh{position:sticky;top:-18px;z-index:1;background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acc);padding:12px 0 5px;border-bottom:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.rmk{width:20px;height:18px;margin-top:3px;border-radius:3px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--fg)}
.rmk.new{background:var(--acc);color:var(--on-acc);box-shadow:none}
.rbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.rsen,.ract,.rev{margin:0;text-wrap:pretty;word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.rsen{font-size:14px;line-height:1.65}
.rflow{display:flex;flex-direction:column;gap:1px;padding-top:6px;border-top:1px dashed var(--line)}
.rflow:first-of-type{border-top:0;padding-top:0}
.ract{font-size:12.5px;line-height:1.55;color:var(--muted)}
.rev{display:grid;grid-template-columns:16px minmax(0,1fr);font-size:13px;line-height:1.55;font-weight:700}
.rev span:first-child{color:var(--acc)}
.rdock{display:flex;flex-direction:column;gap:8px}
.rgist{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;line-height:1.55;margin-bottom:4px}
.rgist th{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 0 4px}
.rgist td{vertical-align:top;padding:7px 10px 7px 0;border-top:1px solid var(--line);text-wrap:pretty;word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.rgist td+td{padding-right:0;font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:3px;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.seg a{min-height:40px;border-radius:3px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.seg a[aria-current]{background:var(--fg);color:var(--bg)}
/* cs・ops の文書: 章と部品を描く */
.dsec{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.dh{margin:0;font-size:15px;line-height:1.5}
.dsec p,.dsec li{margin:0;font-size:14px;line-height:1.7;text-wrap:pretty;word-break:auto-phrase;line-break:strict;white-space:pre-wrap}
.dsec ol,.dsec ul{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.dtb{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.55}
.dtb th{font-size:11px;color:var(--muted);text-align:left;padding:0 8px 4px 0}
.dtb td{vertical-align:top;padding:7px 8px 7px 0;border-top:1px solid var(--line);min-width:72px}
.dsvg{display:block;width:100%;height:auto}
.dwarn{padding:9px 12px;border-radius:3px;font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--stuck);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rmk.old{box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
/* behavior の盤面（event modeling の図）: 時間は左から右へ。上から 役者のレーン → コマンド・リードモデル → 時間軸 → 集約のレーン。色は event modeling の慣例 */
.bleg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11px;color:var(--muted)}
.bleg span{display:flex;align-items:center;gap:5px}
.bleg i{width:11px;height:11px;border-radius:3px}
.i-rm{background:var(--em-rm-bg)}.i-cmd{background:var(--em-cmd-bg)}.i-ev{background:var(--em-ev-bg)}.i-pol{background:var(--em-pol-bg);box-shadow:inset 0 0 0 1px var(--em-pol)}
.emwrap{position:relative;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.emscroll{overflow-x:auto;overscroll-behavior-x:contain}
.emboard{position:relative}
.emsvg{position:absolute;left:0;top:0;pointer-events:none}
.emsep{position:absolute;left:0;height:1px;background:var(--line)}
.emlabs{position:absolute;left:0;top:0;z-index:2;width:66px;pointer-events:none}
.emlab{position:absolute;left:0;width:66px;padding:6px 6px 0 0;background:var(--bg);font-size:10.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.emlab small{display:block;font-size:9.5px;font-weight:400;color:var(--muted)}
.emc,.ems{position:absolute;z-index:1;display:flex;flex-direction:column;gap:3px;padding:6px 7px;border-radius:3px;font-size:11px;line-height:1.3;overflow:hidden}
.emc{background:var(--surface);box-shadow:0 0 0 1px var(--line),0 2px 6px var(--shadow)}
.emc.pol{background:var(--em-pol-bg);box-shadow:0 0 0 1px color-mix(in oklch,var(--em-pol) 45%,transparent)}
.emk{font-size:9.5px;color:var(--muted)}
.emt{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-right:16px}
.emsk{margin:0;flex:1;min-height:0;overflow:hidden;font:6px/1.25 var(--mono);color:var(--muted);white-space:pre}
.ems{font-weight:700;box-shadow:0 1px 2px var(--shadow)}
.ems span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ems.cmd{background:var(--em-cmd-bg)}.ems.rm{background:var(--em-rm-bg)}.ems.ev{background:var(--em-ev-bg)}
.ems.alt{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--em-ev);font-weight:400}
.emold{opacity:.45}
.emtag{position:absolute;top:5px;right:5px;font-size:9px;font-style:normal;font-weight:700;line-height:14px;padding:0 4px;border-radius:3px;background:var(--acc);color:var(--on-acc)}
.emtag.mod{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.emaxis{position:absolute;height:2px;background:var(--fg)}
.emno{position:absolute;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.emtc{position:absolute;font-size:10.5px;color:var(--muted);white-space:nowrap}
.emtc b{color:var(--fg)}
.ea{fill:none;stroke-width:1.4}
.ea.cmd{stroke:var(--em-cmd)}.ea.src{stroke:var(--em-rm)}.ea.rd{stroke:var(--em-rm);stroke-dasharray:4 3}.ea.pol{stroke:var(--em-pol);stroke-dasharray:4 3}
.mh.cmd{fill:var(--em-cmd)}.mh.rd{fill:var(--em-rm)}.mh.pol{fill:var(--em-pol)}
.ems.hot{background:var(--em-hot-bg);box-shadow:inset 0 0 0 1px var(--em-hot)}
.ems.hot small{font-weight:400;font-size:10px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.embub{position:absolute;right:5px;bottom:4px;font-size:9px;font-style:normal;font-weight:700;line-height:14px;padding:0 5px;border-radius:3px;background:var(--fg);color:var(--bg)}
.emid{margin:0;font-size:12px;line-height:1.6;color:var(--muted)}
.emid b{color:var(--fg)}
.emhot{padding:1px 8px;border-radius:3px;background:var(--em-hot-bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--em-hot)}
.emfh{margin:18px 0 0;font-size:13px;font-weight:700}
.emfh small{font-weight:400;color:var(--muted)}
.cmt{display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:3px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.cmt.done{opacity:.55}
.ct{font-size:13px;line-height:1.55;white-space:pre-wrap}
.cr{font-size:12.5px;line-height:1.55;font-weight:700;white-space:pre-wrap}
.cw{font-size:11.5px;color:var(--muted)}
.cmb{flex:1;min-height:40px;text-align:left;font-size:13px;font-weight:700;color:var(--acc)}
.cdone{align-self:flex-end;font-size:12px;font-weight:700;color:var(--acc);min-height:32px}
.sk{margin:0;padding:8px 10px;border-radius:3px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font:11px/1.45 var(--mono);white-space:pre;overflow-x:auto}
.sk.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.w2{display:inline-block;width:2ch;text-align:center}
.tk{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.th{display:flex;align-items:flex-start;gap:8px;font-size:14px;font-weight:700;line-height:20px}
.th .rmk{margin-top:1px;flex:none}
.tt{min-width:0;overflow-wrap:anywhere}
.th .cnt{margin-left:auto;flex:none;white-space:nowrap;font-weight:400}
.ex{display:flex;flex-direction:column;gap:3px;padding:9px 11px;border-radius:3px;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-width:0}
.en{margin:0 0 2px;font-size:13px;font-weight:700;line-height:1.45;text-wrap:pretty}
.g{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:6px;font-size:12px;line-height:1.6}
.g>span:first-child{color:var(--muted);font-weight:700}
.g>span+span{min-width:0;overflow-wrap:break-word}
.fx{font-weight:700}
.kv i{font-style:normal;color:var(--muted)}
.no{color:var(--stuck);font-weight:700}
.rows{border-collapse:collapse;font-size:11.5px;line-height:1.5}
.rows th,.rows td{padding:2px 10px 2px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.rows th{color:var(--muted);font-weight:700}
/* qa: 品質ダッシュボード。判定 → ケースの消化（棒）→ 見てほしいケースの順に、上から読めば QA が十分かが分かる */
.qv{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:3px;background:var(--pas);color:var(--on-pas)}
.qv .cnt,.qv .stxt{color:var(--on-pas2)}
.qv .warn{color:var(--on-pas)}
.qvm{font-size:22px;line-height:28px;font-weight:600}
.qbar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line)}
.qbar i{display:block}
.o-pass{background:var(--done)}.o-fail{background:var(--stuck)}.o-block{background:var(--review)}.o-none{background:var(--wait)}
.qleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qleg span{display:flex;align-items:center;gap:5px}
.qleg i{width:8px;height:8px;border-radius:3px}
.qrow{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.qk{align-self:start;text-align:center;font-size:10.5px;font-weight:700;line-height:18px;border-radius:3px;color:var(--fg);background:color-mix(in oklch,var(--wait) 60%,transparent)}
.qk.o-pass{background:var(--done)}.qk.o-fail{background:var(--stuck)}.qk.o-block{background:var(--review)}
.qk.o-pass,.qk.o-fail,.qk.o-block{color:var(--on-acc)}
.qb{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.qb small{font-size:11.5px;color:var(--muted)}
.qshots{display:flex;gap:6px;overflow-x:auto;padding-top:4px}
.qshots img{height:96px;border-radius:3px;box-shadow:0 0 0 1px var(--line);background:var(--surface)}
/* coder: 設計図の地図。幅いっぱいに、上の帯（戻る・題名・構造と流れ）と盤面。2 つの面は同じ設計図の投影で、重ねて置き、片方だけ見せる
   色は 2 つの軸に分ける: どの世界か = 字と線の色（API・保存。ドメインは無彩）、今回の変更 = 蛍光ペンの塗り（新・改。削は薄く） */
.app:has(.cmap){max-width:none}
.glance:has(> .cmap){padding:0;overflow:hidden}
.cmap{flex:1;min-height:0;display:flex;flex-direction:column}
.chead{flex:none;height:48px;display:flex;align-items:center;gap:12px;background:var(--chrome);color:var(--on-chrome)}
.chead>a{flex:none;display:flex;align-items:center;min-height:44px;font-size:12px;color:var(--on-chrome2);white-space:nowrap}
.chead>button{flex:1;min-width:0;min-height:44px;font-size:16px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 今いる場所: 見出しが画面の上に出た箱の名前を、盤面の上端に留める（上の帯に置くと題名と取り合って 1 字に切れる） */
.crumbs{position:absolute;z-index:1;left:8px;top:8px;max-width:calc(100% - 16px);display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:3px;background:var(--surface);box-shadow:0 1px 4px var(--shadow),0 0 0 1px var(--line);overflow-x:auto;scrollbar-width:none;font-size:13px;color:var(--muted)}
.crumbs:empty{display:none}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{min-height:36px;white-space:nowrap}
.crumbs button:last-child{color:var(--fg);font-weight:600}
.cmap[data-view="flow"] .crumbs{display:none}
.ctabs{flex:none;display:grid;grid-template-columns:repeat(2,60px);gap:3px;height:36px;padding:3px;border-radius:3px;background:color-mix(in oklch,var(--on-chrome) 8%,transparent)}
.ctabs a{display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:3px;color:var(--on-chrome)}
.ctabs a[aria-current]{font-weight:600;background:var(--fill);color:var(--on-fill)}
.ctabs a[aria-disabled]{opacity:.4;pointer-events:none}
/* 箱に載らないこと（coder が決めたこと・残した穴）。地図の上に 1 行で数を出し、押すと地図に重ねて並べる */
.cvp{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);font-size:14px;line-height:1.4}
.cvp svg{position:absolute;inset:0 0 26px;display:block;width:100%;height:calc(100% - 26px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cvp svg.drag{cursor:grabbing}
.cmap[data-view="flow"] [data-m^="struct-"],.cmap:not([data-view="flow"]) [data-m^="flow-"]{visibility:hidden;pointer-events:none}
/* 構造: 枠 = 型（破線の枠 = コードでは型になっていない）、離れて並ぶ箱 = どれか 1 つ、罫線で割った行 = 全部そろう、矢 = 遷移。線は画面上 1px */
.cvp text{fill:var(--fg)}
.cvp text.hide{display:none}
.cvp .mid{dominant-baseline:central}
.cvp .frame-r{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.cvp .row-r{fill:transparent;stroke:none}
.cvp .cat:not(.row)>.frame-r{fill:var(--surface)}
.cvp .cat.imp>.frame-r{stroke:var(--cm-edge);stroke-dasharray:4 3}
.cvp .frame-r,.cvp .row-r,.cvp .obj-r{transform-box:fill-box;transform-origin:0 0}
.cvp .born{animation:cborn .24s ease-out}@keyframes cborn{from{opacity:0}}
.cvp .hair{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.cvp .obj-r{fill:var(--surface);stroke:var(--cm-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.cvp .mor{fill:none;stroke:var(--cm-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.cvp .mor.auto{stroke-dasharray:4 3}
.cvp .head{fill:var(--cm-edge)}
.cvp .mor.hot:not(.ch-new):not(.ch-mod){stroke:var(--fg)}.cvp .mor.hot{stroke-width:1.75}.cvp .head.hot:not(.ch-new):not(.ch-mod),.cvp .ml.hot{fill:var(--fg)}.cvp .dim{opacity:.22}
.cvp .ti,.cvp .nm{font-weight:600}
.cvp .row .ti{font-weight:400}
.cvp .form{fill:var(--muted);font-weight:400}
.cvp .ml{fill:var(--muted);stroke:var(--bg);paint-order:stroke;stroke-linejoin:round}
.cvp .prim{fill:var(--muted);font-family:var(--mono)}
.cvp .floor .rest,.cvp .floor .form{display:none}
.cvp .wl{fill:var(--muted);font-weight:600;letter-spacing:.04em}
.cvp .wl.api{fill:var(--cm-api)}.cvp .wl.db{fill:var(--cm-db)}
/* 今回の変更は蛍光ペンで塗る: 箱と行は地、矢は太い下敷き、名札と題名は字の裏。世界の色（字と線そのものの色）とは別の見え方にする */
.cvp .chg{font-weight:600}
.cvp .ch-new>text>.chg,.cvp text.ch-new>.chg{fill:var(--cm-add)}.cvp .ch-mod>text>.chg,.cvp text.ch-mod>.chg{fill:var(--cm-mod)}
.cvp .cat.ch-new>.frame-r,.cvp .cat.ch-new>.row-r,.cvp .ch-new>.obj-r{fill:var(--cm-add-bg)}.cvp .cat.ch-mod>.frame-r,.cvp .cat.ch-mod>.row-r,.cvp .ch-mod>.obj-r{fill:var(--cm-mod-bg)}
.cvp .hl{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.cvp .hl.ch-new{stroke:var(--cm-add-bg)}.cvp .hl.ch-mod{stroke:var(--cm-mod-bg)}.cvp .hl.ch-del{stroke:none}
.cvp .fn{paint-order:stroke;stroke-width:5px;stroke-linejoin:round;stroke:none}
.cvp .ml.ch-new,.cvp .fn.ch-new{stroke:var(--cm-add-bg)}.cvp .ml.ch-mod,.cvp .fn.ch-mod{stroke:var(--cm-mod-bg)}
.cvp g.ch-del>rect,.cvp path.ch-del,.cvp polygon.ch-del{opacity:.5}.cvp g.ch-del>text,.cvp text.ch-del{fill:var(--muted)}
/* 世界をまたぐ対応と、流れの面から来た型は、縁を濃くするだけ */
.cvp .linked>.frame-r,.cvp .linked>.row-r{stroke:var(--acc);stroke-width:1.5}
/* 流れ: 線 = 値、箱 = 処理。色は外の世界に触れる所だけ（API の値と、保存の値・保存の箱）。両面で同じ色が同じ世界を指す */
.cvp .wire{fill:none;stroke:var(--cm-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.cvp .wire.io{stroke-width:1.5}.cvp .wire.api{stroke:var(--cm-api)}.cvp .wire.stored{stroke:var(--cm-db)}
.cvp .wire.hot{stroke-width:2}.cvp .wire.hot:not(.io){stroke:var(--fg)}
.cvp .hit{fill:none;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;pointer-events:stroke}
.cvp .cap,.cvp .fail,.cvp .wn{fill:var(--muted)}.cvp .bn,.cvp .fn,.cvp .wn.io{font-weight:600}
.cvp .wn.api{fill:var(--cm-api)}.cvp .wn.stored,.cvp .cap.stored{fill:var(--cm-db)}.cvp .wn.hot:not(.io){fill:var(--fg)}
.cvp .same>.obj-r{stroke:var(--acc);stroke-width:1.5}
@media (hover:hover){
  .cvp .cat:not(.row):not(.linked):not(.ch-new):not(.ch-mod):hover>.frame-r{stroke:var(--cm-edge)}.cvp .pt:not(.ch-new):not(.ch-mod):hover>.obj-r{stroke:var(--acc)}.cvp .row[data-inv]:hover>.row-r{fill:var(--dim)}
  .cvp .box:not(.ch-new):not(.ch-mod):not(.same):hover>.obj-r{stroke:var(--fg)}.cvp [data-inv]:hover,.cvp [data-doc]:hover{cursor:help}
}
/* 吹き出し: 図に描かない 1 つ奥の情報（意図・不変条件・処理の補足）。線を押して留めたときだけ、構造の面への入口が付く */
.cvp .tip{position:absolute;z-index:2;width:max-content;max-width:min(300px,calc(100% - 32px));padding:10px 12px;border-radius:3px;background:var(--surface);box-shadow:0 4px 16px var(--shadow),0 0 0 1px var(--line);pointer-events:none;display:grid;gap:6px}
.cvp .tip p{margin:0;font-size:14px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}
.cvp .tip p.doc{font-size:13px;font-weight:400;white-space:pre-line}
.cvp .tip p.of{font-size:12px;color:var(--muted)}
.cvp .tip.pinned{pointer-events:auto}
.cvp .tip.docked{left:12px!important;right:12px;top:auto!important;bottom:38px;width:auto;max-width:none}
.cvp .tip.docked.up{top:12px!important;bottom:auto}
/* 留めた吹き出しが語っている箱。離れて出るので、縁でつなぐ */
.cvp .told>rect{stroke:var(--fg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.cvp .tip button{justify-self:start;min-height:40px;font-size:13px;font-weight:600;color:var(--acc)}
/* 凡例: 語がそのまま見本。世界は字の色、変更は塗り。左下に 1 行で、その面に出ている色だけ */
/* 凡例は盤面の下の帯に置く（盤面に重ねると、下の箱の名前を隠す） */
.cleg{position:absolute;left:0;right:0;bottom:0;height:26px;margin:0;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-left,0px));background:var(--bg);font-size:11px;font-weight:600;line-height:1;pointer-events:none}
.cleg [data-k="api"]{color:var(--cm-api)}.cleg [data-k="db"]{color:var(--cm-db)}
.cleg [data-k="new"],.cleg [data-k="mod"]{margin-block:-2px;padding:2px 4px;border-radius:2px}
.cleg [data-k="new"]{color:var(--cm-add);background:var(--cm-add-bg)}.cleg [data-k="mod"]{color:var(--cm-mod);background:var(--cm-mod-bg)}
.cleg [data-k="new"],.cleg [hidden]+[data-k="mod"]{margin-left:6px}
.cleg [data-k="imp"]{margin-block:-3px;padding:2px 4px;border:1px dashed var(--cm-edge);border-radius:2px;color:var(--muted)}
.cdock{width:100%;max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.spin,.tfill{animation:none}.knob,.act{transition:none}.cvp .born{animation:none}}
</style>

<div class="app" id="app" lang="ja">
  <main class="glance gut" id="glance"><p class="req wait">読み込み中</p></main>
  <section class="dock" id="dock" aria-label="あなたの番"></section>
  <div class="scrim" id="sheet" hidden></div>
</div>

<script id="coder-map">

    Object.assign(n, { boxes: pts, lanes, loops, idx, cells, colX, colW, rowY, rowH, colGap, rowGap, fl, nC, laneN, loopRow, loopNth, named });
    n.w = Math.max(x + colGap[nC], n.minW); n.h = y + rowGap[nR];
    if (!arrows.length && !loops.length && !objs.every(o => o.at)) { // 矢の無い種類は格子にそろえず、詰めて並べる
      let fx = pad, fw = 0; pts.forEach((q, i) => { if (!cells[i].c) fx = pad; q.x = fx; fx += q.w + F * .3; fw = Math.max(fw, fx - F * .3 + pad); });
      n.w = Math.max(fw, n.minW);

  };
  // 最上位に並べる型: ほかの型の部品になっていない型（書いた順）。自分を含む型（木）は自分の部品に数えない
  const tops = () => { const used = new Set(M.types.flatMap(t => (t.objects || []).flatMap(partsOf).map(p => p.type).filter(id => id !== t.id))); return M.types.filter(t => !used.has(t.id)); };
  // 図を組む。世界を左から右へ並べ、世界ごとに最上位の型を棚に詰める。配置は設計図だけで決まり、画面には依らない（画面は地図を覗く窓。どの画面でも同じ 1 枚を、動かして寄って見る）
  const place = D => {
    OPEN = D;

    const cols = WORLDS.map(id => M.worlds.find(w => w.id === id)).map(w => ({ w, top, frames: shown.filter(t => t.world === w.id).map(t => frame(t, undefined, 1, false, [])) })).filter(c => c.frames.length);
    let X = 0, W = 0, H = 0;
    for (const c of cols) {

      let x = 0, y = top, rowH = 0, cw = 0;
      const fresh = !memo.shelf[c.w.id], brk = memo.shelf[c.w.id] ||= [];
      c.frames.forEach((f, i) => {
        if (fresh) brk[i] = x > 0 && x + f.w > limit;
        if (brk[i]) { x = 0; y += rowH + gap; rowH = 0; }

      });
      c.x = X; c.y = 0; W = Math.max(W, X + cw); H = Math.max(H, y + rowH);

  // 引けるのは、畳んだ型の名前が 10px で読める倍率（MINS）まで。下限は図の大きさに依らない（開いた図と畳んだ図で下限が違うと、引くたびに開いて閉じてを繰り返す）

  // 最初の画面: 全体が収まって名前が読める範囲で、いちばん深くまで開いた図。畳んでも収まらない地図は、名前が読める大きさで左上から（続きは動かして見る）
  const home = v => {

    // 最初の世界の名前を上の帯のすぐ下に置く
    return { placed, cam: { s, tx: Math.max(16, (v.w - placed.W * s) / 2), ty: 26 - label(placed, s) } };

  const label = (p, s) => (p.cols.length ? p.cols[0].top * s - Math.min(64 * s, 16) : 0);

// 倍率から開く深さを決める。境目では少し粘る（行ったり来たりで図が組み変わらないように）
const levelOf = (s, open) => { let D = 0; while (D < DEEP && s >= openAt(D + 1)) D++; return D < open && s > openAt(open) * .93 ? open : D; };

// ---------- 操作: ドラッグで動かす、ピンチとホイールで近づく、押す、二度押しで近づく。面はカメラの読み書き（cam・put・clamp・zoomAt）と、押した・重ねたときの振る舞いを渡す
const gestures = (svg, face) => {
  const ptrs = new Map(); let drag = null, pinch = null, lastTap = null;
  const local = e => { const r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const grip = () => { const [p, q] = [...ptrs.values()], r = svg.getBoundingClientRect(); return { ...face.cam(), d: Math.hypot(p[0] - q[0], p[1] - q[1]), mx: (p[0] + q[0]) / 2 - r.left, my: (p[1] + q[1]) / 2 - r.top }; };

    const now = performance.now(), [px, py] = local(e);
    if (lastTap && now - lastTap.t < 320 && Math.hypot(px - lastTap.x, py - lastTap.y) < 30) { lastTap = null; face.zoomAt(2, px, py); return; }

    svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); face.touch();

  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) { if (e.pointerType === 'mouse' && !e.buttons) face.hover(e); return; }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (pinch && ptrs.size === 2) {
      const now = grip(), s = face.clamp(pinch.s * now.d / pinch.d), k = s / pinch.s;
      // 近づく途中で図が組み直ったら、そこを新しい起点にする
      if (face.put({ s, tx: now.mx - (pinch.mx - pinch.tx) * k, ty: now.my - (pinch.my - pinch.ty) * k }, [now.mx, now.my])) pinch = grip();
    } else if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; svg.classList.add('drag'); face.hush(); } // 動かし始めたら吹き出しを畳む（次に見たい所を隠さない）
      if (drag.moved) face.put({ s: face.cam().s, tx: drag.tx + dx, ty: drag.ty + dy });
    }
  });
  const up = e => {
    ptrs.delete(e.pointerId);

};
// 画面に字がほとんど無ければ（端から 40px 入った字が 1 つも無い）、いちばん近い字がそこまで入る所へカメラを戻す（余白だけの白い画面に落とさない）。戻したカメラを返す
const keepInk = (svg, world, cam) => {
  const v = svg.getBoundingClientRect(), m = { left: v.left + 40, right: v.right - 40, top: v.top + 40, bottom: v.bottom - 40 }; let near = null, least = Infinity;
  for (const t of world.querySelectorAll('text:not(.hide)')) {
    const r = t.getBoundingClientRect(); if (!r.width) continue;
    const dx = r.left > m.right ? m.right - r.left : r.right < m.left ? m.left - r.right : 0, dy = r.top > m.bottom ? m.bottom - r.top : r.bottom < m.top ? m.top - r.bottom : 0;
    if (!dx && !dy) return cam;
    if (Math.hypot(dx, dy) < least) { least = Math.hypot(dx, dy); near = [dx, dy]; }
  }
  if (!near) return cam;
  const back = { s: cam.s, tx: cam.tx + near[0], ty: cam.ty + near[1] };
  world.setAttribute('transform', `matrix(${back.s} 0 0 ${back.s} ${back.tx} ${back.ty})`);

// カメラを滑らかに動かす。each が返した移動ぶん（図の組み直し）は、行き先にも足す
// 行き先の画面の左上に来る点を、画面の上でまっすぐ運ぶ（倍率と位置を別々に補うと、遠くの箱は途中で画面の外へ振れる）

    const shift = each({ s, tx: (wx * a.s + a.tx) * (1 - e) - wx * s, ty: (wy * a.s + a.ty) * (1 - e) - wy * s });
    if (shift) { a.tx += shift.x; b.tx += shift.x; a.ty += shift.y; b.ty += shift.y; }
    if (k < 1) requestAnimationFrame(step); else done();
  };

};

// ---------- 構造の面。1 つの SVG に置き、カメラ（拡大・移動）で見る。読めないものは描かず、近づくと 1 段ずつ開く

const CAP = { nm: 15, ti: 13, ml: 12, prim: 13, wl: 13 }, MIN = 11;

  let tipOf = null, toldOf = null, tipS = 0, tipHover = false, pinned = null, traced = null, shown = null;

  const mark = (g, text, change) => { if (!change) return; g.classList.add(CH[change]); text.append(tspan(' ' + change, 'chg')); };
  const note = (g, n) => { const doc = [n.kind === 'frame' && !n.row && n.t && loose(n.t) && IMPLICIT, n.doc].filter(Boolean).join('\n'); if (n.inv) g.dataset.inv = n.inv; if (doc) g.dataset.doc = doc; };
  // 矢 = 遷移。中の出来事で起きる遷移（auto）は破線。変更は太い下敷きで塗る
  const drawArrow = (n, pts, m, lx, ly, anchor) => {
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '), cls = chOf(m.change);
    const path = sv('path', { d, class: 'mor' + (m.auto ? ' auto' : '') + cls });
    const p1 = pts[pts.length - 2], p2 = pts[pts.length - 1], len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1;
    const poly = sv('polygon', { class: 'head' + cls });
    heads.push({ poly, tip: p2, ux: (p2[0] - p1[0]) / len, uy: (p2[1] - p1[1]) / len, size: n.F * .2 });
    const label = sv('text', { x: lx, y: ly, 'font-size': n.fl, 'text-anchor': anchor, class: 'ml mid' + cls }, [m.by]);
    if (m.change) label.append(tspan(' ' + m.change, 'chg'));
    return [...(m.change ? [sv('path', { d, class: 'hl' + cls })] : []), path, poly, label];
  };
  const arrow = (n, a) => {
    const { m, ca, cb } = a, A = n.boxes[n.idx[m.from]], B = n.boxes[n.idx[m.to]], F = n.F, fl = n.fl;
    const port = (Q, k) => Q.y + F * (.9 + k);
    if (a.kind === 'h') { // 同じ行の隣: 水平。名札は相手の箱の手前、線の上
      const y = port(A, a.p), right = cb.c > ca.c, g = Math.max(ca.c, cb.c);
      return drawArrow(n, right ? [[A.x + A.w, y], [B.x, y]] : [[A.x, y], [B.x + B.w, y]], m, n.colX[g] - fl * .6, y - fl * .75, 'end');
    }
    if (a.kind === 'v') { // 同じ列の隣: 垂直。往復は左右にずらす
      const x = Math.max(A.x, B.x) + Math.min(A.w, B.w, F * 3) / 2 + a.nth * (fl * 1.2 + n.named(m)), down = cb.r > ca.r;
      return drawArrow(n, down ? [[x, A.y + A.h], [x, B.y]] : [[x, A.y], [x, B.y + B.h]], m, x + fl * .6, n.rowY[Math.max(ca.r, cb.r)] - n.loopRow[Math.max(ca.r, cb.r)] - F * (.55 + a.laneR * .9) - fl * .75, 'start');

    const sx = a.right ? A.x + A.w : A.x, ex = a.left ? B.x : B.x + B.w, sy = port(A, a.pS), ey = port(B, a.pT), xs = laneX(a.gs, a.laneS);
    if (a.gs === a.gt) {

  const loop = (n, m) => {

    return drawArrow(n, [[x1, y], [x1, y - h], [x2, y - h], [x2, y]], m, x2 + n.fl * .4, y - F * .6 - up, 'start');
  };
  // 描く。絶対位置を nodes に控える（押して寄る、今いる場所）

    const g = sv('g', { transform: `translate(${r.x} ${r.y})` }), AX = ax + r.x, AY = ay + r.y;
    r.rows.forEach((row, i) => { if (i) g.append(sv('line', { x1: 0, y1: row.y, x2: r.w, y2: row.y, class: 'hair' })); renderFrame(row, g, AX, AY, key + '/' + i); });
    return g;
  };
  const renderObj = (q, ax, ay, key) => {
    const g = sv('g', { class: 'pt', transform: `translate(${q.x} ${q.y})` }), AX = ax + q.x, AY = ay + q.y;
    g.append(sv('rect', { width: q.w, height: q.h, rx: q.f * .08, class: 'obj-r' }));
    const ny = !q.rec && !q.prim ? q.h / 2 : q.pad + q.f * .5; // 名前だけの箱は、名前を縦の真ん中に
    const name = sv('text', { x: q.pad, y: ny, 'font-size': q.f, class: 'nm mid' }, [q.name]);
    name._b = { w: q.w, h: q.h, pad: q.pad, units: unitsOf(q) };

    g.append(name);

    if (q.prim) g.append(sv('text', { x: q.pad, y: q.pad + q.f * 1.3 + q.f * .6, 'font-size': q.f * .85, class: 'prim mid' }, [q.prim]));

    const g = sv('g', { class: 'cat' + (n.row ? ' row' : n.t && loose(n.t) ? ' imp' : ''), transform: `translate(${n.x} ${n.y})` }), AX = ax + n.x, AY = ay + n.y;
    g.append(sv('rect', { width: n.w, height: n.h, rx: n.row ? 0 : n.F * .06, class: n.row ? 'row-r' : 'frame-r' }));
    const ty = n.prim !== undefined || n.leaf ? n.h / 2 : n.pad + n.ft * .5;
    const title = sv('text', { x: n.pad, y: ty, 'font-size': n.ft, class: 'ti mid' }, []);
    if (n.bold >= 0) title.append(n.label.slice(0, n.bold), tspan(n.label.slice(n.bold), 'form'));
    else if (n.row && n.short && n.label !== n.short) title.append(n.short, tspan(n.label.slice(n.short.length), 'rest')); else title.append(n.label);
    title._b = { w: n.w, h: n.h, pad: n.pad, units: unitsOf(n) };
    if (n.many) title.append(tspan(n.many, 'form'));

    g.append(title);
    if (n.t) { g.dataset.type = n.t.id; (byType[n.t.id] ||= []).push(g); }
    if (!n.line) nodes.push({ g, n, key, need: n.need, x: AX, y: AY, w: n.w, h: n.h, head: n.row || n.leaf || n.prim !== undefined ? 0 : n.pad + n.ft * 1.35, label: n.label });

  const draw = placed => {
    P = placed; nodes = []; heads = []; byType = {}; wls = []; lastS = 0;
    world.replaceChildren();
    const F0 = unitAt(0);
    for (const c of P.cols) {
      const wl = sv('text', { x: c.x, y: c.y + F0 * .7, 'font-size': F0 * 1.2, class: 'wl mid ' + c.w.id, 'data-y': c.y + c.top }, [c.w.name]);
      world.append(wl); wls.push({ id: c.w.id, el: wl, x: c.x, y: c.y });

    showTip(null);
  };
  const build = D => draw(eng.place(D));

  // 1 つ奥の情報。箱に重ねる（指は押す）と、意図と不変条件の吹き出しが出る
  // dock = 指で押したとき。吹き出しは盤面の端に留める（箱の脇に出すと、見比べたい隣の箱を隠す）。押した箱が下半分なら上端へ
  // 指で押した箱は必ず答える（何も起きないと、押し損ねに見える）: 縁を濃くし、名前を名乗り、状態なら出入りする遷移を、矢ならその両端を字で言う（幅に収まらない図をなぞらなくて済む）。語ることが無ければ、無いと言う

    const pack = k => { const at = []; let y = 0, w = 0; for (let i = 0; i < lays.length; i += k) { let x = 0, h = 0; lays.slice(i, i + k).forEach(l => { at.push([x, y]); x += l.w + GX; h = Math.max(h, l.h); }); w = Math.max(w, x - GX); y += h + GY; } return { at, w, h: y - GY }; };
    let k = lays.length; while (k > 1 && pack(k).w > ROW) k--;
    const best = pack(k);
    return { flows: lays, at: best.at, W: best.w, H: best.h };
  };
  return { place };
})();

// ---------- 流れの面。色は外の世界に触れる所だけ: API の値と、保存の値・保存の箱
const flowFace = (svg, world, tipEl, jump) => {
  const view = () => sizeOf(svg);
  let M, W = 0, H = 0, texts = [], boxes = [];
  let cam = { s: 1, tx: 0, ty: 0 }, raf = 0, touched = false, lastS = 0;
  let tipOf = null, toldOf = null, tipPinned = false, traced = null, same = null;

  const render = (lay, X, Y, fi) => {
    const g = sv('g', { transform: `translate(${X},${Y})` }), { flow: fl, colX, gy, boxes: bx, by } = lay;
    const text = (attrs, kids, meta) => { const t = sv('text', attrs, kids); texts.push({ t, f: +attrs['font-size'], ...meta }); return t; };
    const fn = text({ x: 0, y: FONT.fn * .7, 'font-size': FONT.fn, class: 'fn mid' + chOf(lay.whole) }, [fl.name], { role: 'fn' });
    if (lay.whole) fn.append(tspan(' ' + lay.whole, 'chg'));
    g.append(fn);
    const wg = sv('g');
    // 線: 生まれた所（上の端か箱の下）から、受ける箱の上（か下の端）まで
    for (const s of lay.segs) {
      const d = `M${colX[s.c]} ${s.g0 === 0 ? gy[0] : by[s.g0 - 1] + bx[s.g0 - 1].h}V${s.open ? lay.h : by[s.to]}`, io = s.w.kind ? ' io ' + s.w.kind : '';
      wg.append(sv('path', { d, class: 'wire' + io, 'data-w': fi + ':' + s.w.id }), sv('path', { d, class: 'hit', 'data-w': fi + ':' + s.w.id, 'data-name': s.w.name }));
    }
    lay.gaps.forEach((gap, i) => Object.entries(gap).forEach(([c, o]) => {
      const t = text({ x: colX[c] + 7, y: gy[i] + 10 + FONT.wn * .6, 'font-size': FONT.wn, class: 'wn mid' + (o.w.kind ? ' io ' + o.w.kind : ''), 'data-w': fi + ':' + o.w.id, 'data-name': o.w.name }, [], { role: 'wn' });
      o.lines.forEach((l, k) => t.append(sv('tspan', { x: colX[c] + 7, dy: k ? '1.35em' : 0 }, [l])));
      wg.append(t);
    }));
    g.append(wg);
    bx.forEach(b => {
      const bg = sv('g', { class: 'box' + chOf(b.ch), transform: `translate(${b.x},${b.y})`, 'data-logic': b.lg.id });
      const doc = [b.lg.note, b.also && 'ほかに通る流れ: ' + b.lg.also.join('、')].filter(Boolean).join('\n'); if (doc) bg.dataset.doc = doc;
      bg.append(sv('rect', { width: b.w, height: b.h, rx: 2, class: 'obj-r' }));
      bg.append(text({ x: PAD, y: 9 + FONT.cap * .65, 'font-size': FONT.cap, class: 'cap mid' + (b.lg.layer === 'persistence' ? ' stored' : '') }, [b.kind], { role: 'sub' }));
      const y = 9 + FONT.cap * 1.3 + FONT.bn * .72, nm = text({ x: PAD, y, 'font-size': FONT.bn, class: 'bn mid' }, b.lines.map((l, k) => sv('tspan', { x: PAD, dy: k ? '1.3em' : 0 }, [l])), { role: 'bn', box: b, units: b.units, cy: b.h / 2, y });
      if (b.ch) nm.append(tspan(' ' + b.ch, 'chg'));
      bg.append(nm);
      b.fails.forEach((f, k) => bg.append(text({ x: PAD, y: b.top + FONT.fail * (k * 1.4 + .7), 'font-size': FONT.fail, class: 'fail mid' }, ['→ ' + f], { role: 'sub' })));
      if (b.also) bg.append(text({ x: PAD, y: b.top + FONT.fail * (b.fails.length * 1.4 + .7), 'font-size': FONT.fail, class: 'fail mid also' }, [b.also], { role: 'sub' }));
      g.append(bg); boxes.push({ g: bg, name: b.lg.name, x: X + b.x, y: Y + b.y, w: b.w, h: b.h });
    });
    return g;
  };
  const build = () => {
    texts = []; boxes = []; lastS = 0; world.replaceChildren();
    const p = Flow.place(M); W = p.W; H = p.H;
    p.flows.forEach((l, i) => world.append(render(l, p.at[i][0], p.at[i][1], i)));
  };

  // 文字は画面上の大きさで決める: 箱の名前は 10px を下限に（箱に入るなら）、添え書きは縮尺どおりで読める大きさから
  const lod = () => {
    if (cam.s === lastS) return; lastS = cam.s; const s = cam.s;
    for (const { t, f, role, box, units, cy, y } of texts) {
      let size, show = true;
      if (role === 'bn') { const k = box.lines.length, fit = Math.min(((box.w - 2 * PAD) * s + 2) / units, k > 1 ? (box.h * s - 4) / (k * 1.3) : Infinity); size = Math.min(Math.max(f * s, 10), 15, Math.max(fit, 7.5)); show = fit >= 7.5; t.setAttribute('y', FONT.cap * s < 9 ? cy - (k - 1) * .65 * size / s : y); } // 引いても、箱が何かは名乗る（入らなければ字を 7.5px まで小さく）
      else if (role === 'fn') size = Math.min(Math.max(f * s, 11), 15);
      else { size = Math.min(f * s, 13); show = f * s >= 9; }
      t.classList.toggle('hide', !show); if (show) t.setAttribute('font-size', size / s);
    }
  };
  const apply = () => {
    const v = view(); cam = { s: cam.s, tx: span(cam.tx, W * cam.s, v.w, 16), ty: span(cam.ty, H * cam.s, v.h, 16) };
    world.setAttribute('transform', `matrix(${cam.s} 0 0 ${cam.s} ${cam.tx} ${cam.ty})`);
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; lod(); cam = keepInk(svg, world, cam); placeTip(); });
  };
  const put = c => { cam = c; apply(); };
  // 寄れる上限は、字が育ちきる倍率（1.1 強）の少し上。その先は箱と余白だけが育つ
  const clamp = s => { const v = view(); return Math.min(1.4, Math.max(.2, Math.min(v.w / W, v.h / H) * .5, s)); };
  const setCam = (c, animate) => { if (!animate || still()) put(c); else glideCam(cam, c, put, () => {}); };
  // 全体: 幅に合わせ、上から。添え書きが読める倍率を下回らず、入りきらない分は動かして見る
  const home = () => { touched = false; traced = same = null; showTip(null); build(); const v = view(), s = clamp(Math.min(Math.max(v.w / W * .96, READ), 1.1)); put({ s, tx: Math.max(10, (v.w - W * s) / 2), ty: 16 }); };
  const zoomAt = (k, px, py, animate = true) => { const s = clamp(cam.s * k), q = s / cam.s; setCam({ s, tx: px - (px - cam.tx) * q, ty: py - (py - cam.ty) * q }, animate); };
  // 箱に寄る: 添え書きが読めているなら倍率は変えず、はみ出したぶんだけ動かす（押すたびに寄り具合が変わると、居場所を失う）。画面より大きい箱は頭を合わせる
  const focus = b => {
    const v = view(), s = Math.max(cam.s, READ);
    const slide = (t, at, len, room) => { const t0 = t + (at + len / 2) * (cam.s - s), a = at * s + t0; return len * s > room - 32 ? 16 - at * s : a < 16 ? t0 + 16 - a : a + len * s > room - 16 ? t0 + room - 16 - a - len * s : t0; };
    setCam({ s, tx: slide(cam.tx, b.x, b.w, v.w), ty: slide(cam.ty, b.y, b.h, v.h) }, true);
  };

  // 1 つ奥の情報。線に重ねると、その値が生まれてから受け取られるまでが濃くなり、型の意図と不変条件が出る。箱に重ねると、同じ処理を使うほかの流れの箱が分かる
  const trace = w => {
    world.querySelectorAll('.hot,.dim').forEach(e => e.classList.remove('hot', 'dim'));
    if (w) world.querySelectorAll('.wire,.wn').forEach(e => e.classList.add(e.dataset.w === w ? 'hot' : 'dim'));
  };
  const mark = id => {
    world.querySelectorAll('.same').forEach(e => e.classList.remove('same'));
    const twins = id ? boxes.filter(b => b.g.dataset.logic === id) : [];
    if (twins.length > 1) twins.forEach(b => b.g.classList.add('same'));
  };
  const says = (t, pin) => {
    if (t.dataset.doc) return [el('p', { class: 'doc' }, [t.dataset.doc])];
    const ty = t.dataset.name && typeOf(M, t.dataset.name); if (!ty) return [];
    const st = statesOf(t.dataset.name), objs = (ty.objects || []).filter(o => (st.length ? st.includes(o.name) : ty.objects.length === 1) && o.holds && o.holds.invariant);
    const go = el('button', { type: 'button' }, [`${ty.name}を構造で見る ›`]); // 押して留めたときだけ、もう 1 つの面への入口が付く
    go.addEventListener('click', () => { showTip(null); jump(ty.id); });
    return [...(loose(ty) || ty.doc ? [el('p', { class: 'doc' }, [[loose(ty) && IMPLICIT, ty.doc].filter(Boolean).join('\n')])] : []), ...objs.map(o => el('p', {}, [(st.length > 1 ? o.name + ': ' : '') + o.holds.invariant])), ...(pin ? [go] : [])];
  };
  const showTip = (t, pin = false, dock = false) => {
    const kids = t ? says(t, pin) : []; tipPinned = pin && kids.length > 0; tipEl.classList.toggle('pinned', tipPinned); tipEl.classList.toggle('docked', dock);
    if (toldOf) toldOf.classList.remove('told');
    toldOf = dock ? t : null; if (toldOf) toldOf.classList.add('told');
    tipOf = t && (dock || kids.length) ? t : null; tipEl.hidden = !tipOf; if (tipOf) { tipEl.replaceChildren(...(dock ? about(t.dataset.name || (boxes.find(b => b.g === t) || {}).name) : []), ...(kids.length ? kids : [el('p', { class: 'of' }, [SILENT])])); placeTip(); }
  };
  const hush = () => { showTip(null); traced = same = null; trace(null); mark(null); };
  const placeTip = () => {
    if (!tipOf) return;
    const m = svg.parentNode.getBoundingClientRect(), r = (tipOf.classList.contains('box') ? tipOf.firstChild : tipOf.classList.contains('hit') ? world.querySelector(`.wn[data-w="${tipOf.dataset.w}"]`) || tipOf : tipOf).getBoundingClientRect(), t = tipEl.getBoundingClientRect();
    if (gone(r, m)) { hush(); return; } // 語っていた物が画面から出たら、薄くしたほかの線も戻す（残ると「削」に見える）
    if (tipEl.classList.contains('docked')) { tipEl.classList.toggle('up', low(r, m)); return; }
    const x = Math.max(12, Math.min(r.left - m.left, m.width - t.width - 12)), above = r.top - m.top - t.height - 6;
    tipEl.style.left = x + 'px'; tipEl.style.top = (above >= 8 ? above : r.bottom - m.top + 8) + 'px';
  };
  const inView = g => { const m = svg.getBoundingClientRect(), r = g.getBoundingClientRect(); return r.left >= m.left && r.right <= m.right && r.top >= m.top && r.bottom <= m.bottom; };
  const pickAt = t => ({ box: t.closest && t.closest('.box'), wire: t.dataset && t.dataset.w ? t : t.parentNode && t.parentNode.dataset && t.parentNode.dataset.w ? t.parentNode : null });
  gestures(svg, {
    cam: () => cam, put, clamp, zoomAt, touch: () => { touched = true; },
    hover: e => {
      const { box, wire } = pickAt(e.target);
      if (!traced) trace(wire ? wire.dataset.w : null);
      if (!same) mark(box ? box.dataset.logic : null);
      const t = wire || box || null; if (!tipPinned && t !== tipOf) showTip(t);
    },
    leave: () => { if (!tipPinned) showTip(null); if (!traced) trace(null); if (!same) mark(null); }, hush: () => hush(),
    tap: (e, target) => {
      const { box, wire } = pickAt(target);
      traced = wire ? wire.dataset.w : null; trace(traced);
      same = box ? box.dataset.logic : null; mark(same);
      if (box && !inView(box)) focus(boxes.find(b => b.g === box)); // 画面に収まっている箱は動かさない
      showTip(wire || (e.pointerType !== 'mouse' ? box : null), !!wire, e.pointerType !== 'mouse');
    },
  });

  return {
    open: (model, keep) => {
      M = model;
      if (!keep || !touched) return home();
      traced = same = null; showTip(null); build(); apply();
    },
    home,
    resize: () => { if (!touched) home(); },
  };
};

// ---------- 1 つの地図。設計図は setModel で受け、attach した要素（ページの .cmap）の 2 つの SVG に描く。面は同じ設計図の投影で、重ねて置き、片方だけ見せる
class View {
  constructor() { this.el = null; this.q = null; this.faces = null; this.model = null; this.json = ''; this.face = ''; }
  // 設計図が書き換わったら組み直す。触っていなければ全体に戻し、触っていれば見ている場所を保つ
  setModel(m) {
    const json = JSON.stringify(m); if (json === this.json) return;
    this.json = json; this.model = m;
    if (this.el && this.el.isConnected) this.open(true);
  }
  open(keep) {
    this.q.title.textContent = this.model.name;
    for (const face of Object.values(this.faces)) face.open(this.model, keep);
    if (this.face) this.show(this.face);
  }
  // ページの .cmap に描く。ページの描き直しで要素が作り直されたら、新しい方に付け替える
  attach(el) {
    if (this.el === el) return;
    const pick = name => el.querySelector(`[data-m="${name}"]`), first = !this.el;
    this.el = el; this.face = '';
    this.q = { title: pick('title'), struct: pick('struct'), flow: pick('flow'), legend: pick('legend') };
    this.faces = {
      struct: structFace(pick('struct-svg'), pick('struct-svg').firstElementChild, pick('struct-tip'), pick('crumbs')),
      flow: flowFace(pick('flow-svg'), pick('flow-svg').firstElementChild, pick('flow-tip'), id => this.jump(id)),
    };
    this.q.title.addEventListener('click', () => this.faces[this.face].home());
    if (first) addEventListener('resize', () => { if (this.el.isConnected) for (const face of Object.values(this.faces)) face.resize(); });
    this.open(false);
  }
  // 面を見せる。中身の無い面（型が無い・流れが無い）は見せず、もう片方を見せる
  show(want) {
    const m = this.model, q = this.q, face = want === 'flow' ? (m.flows.length ? 'flow' : 'struct') : (m.types.length ? 'struct' : 'flow');
    this.face = face; this.el.dataset.view = face;
    for (const [name, has] of [['struct', m.types.length], ['flow', m.flows.length]]) {
      q[name].toggleAttribute('aria-current', name === face); q[name].toggleAttribute('aria-disabled', !has);
    }
    const on = legendOf(m, face); for (const s of q.legend.children) s.hidden = !on[s.dataset.k];
  }
  // 流れの線から、構造のその型へ飛ぶ
  jump(id) { this.show('struct'); this.faces.struct.goto(id); location.hash = this.q.struct.getAttribute('href'); }
}
return { View, Structure, Flow, typeOf, statesOf, levelOf, legendOf, openAt, DEEP };
})()
</script>

<script>
// 状態は DB だけが持つ。ページは onSnapshot で描き直し、ユーザ操作（要レビュー・承認・判断の回答・付箋へのコメント）だけを answers・reviews・comments に書く
// 文書の置き場所は fleet/db/fleet-db.ts が唯一の定義で、mod が publish のときに DB の fleet/db-paths に置く。ページはそれを読む（知っているのはその 1 つだけ）
// 写しの例外: ビルドせずに publish するので、required・レビュー待ちの規則は src/fleet/logic/review.ts の写しを持つ。review を変えたらここも直す
const SHIPS = ['requirement', 'behavior', 'architect', 'coder', 'qa', 'cs', 'security', 'ops']
const NAME = { requirement: '要求', behavior: '振る舞い', architect: 'アーキテクト', coder: '実装', qa: 'QA', cs: 'CS', security: 'セキュリティ', ops: '運用' }
const S = { paths: null, model: null, db: undefined, comments: null, loaded: false, ships: {}, asks: {}, decisions: [], answers: {}, reviews: {}, links: {}, requirements: [], behavior: { moments: [], views: [], readModels: [], flows: [], hotspots: [] }, quality: { checks: [], findings: [], charters: [] }, journal: [], threads: {}, replies: {}, peek: null, remarked: '', problems: [], remaining: null, at: 0, locked: false, done: {}, open: null, free: null, drafts: {}, failed: '', unsendable: '', documents: {}, drawn: '', dockDrawn: '', sheetDrawn: '' }
const $ = id => document.getElementById(id)
const esc = text => String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const hhmm = iso => (iso ? new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '')
const motion = () => !matchMedia('(prefers-reduced-motion: reduce)').matches

// --- 導出
const required = (ship, review) => review?.required ?? ['architect', 'coder', 'qa'].includes(ship)
const awaiting = (ship, status, review) => status.state === 'converged' && required(ship, review) && review?.approved_since !== status.since
const yourTurn = () => {
  const closed = new Set(S.decisions.map(d => d.closes))
  // 回答済みでも flagship に届いていない判断は残し、送り直せるようにする
  const asks = Object.entries(S.asks).filter(([id]) => (!(id in S.answers) || S.answers[id].undelivered) && !closed.has(id))
    .sort(([, a], [, b]) => String(a.at).localeCompare(String(b.at))).map(([id, ask]) => ({ kind: 'ask', key: `ask:${id}`, id, ask }))
  const reviews = SHIPS.filter(ship => S.ships[ship] && awaiting(ship, S.ships[ship], S.reviews[ship]))
    .map(ship => ({ kind: 'review', key: `review:${ship}:${S.ships[ship].since}`, ship, status: S.ships[ship] }))
  return [...asks, ...reviews]
}
// 決めた直後の件は、5 秒間その場に「取り消す」として残す
const items = () => {
  const list = yourTurn().filter(item => !(item.key in S.done))
  Object.values(S.done).sort((a, b) => a.index - b.index).forEach(d => list.splice(Math.min(d.index, list.length), 0, { ...d.item, done: d }))
  return list
}
// あなたが判断すること。ドックに出る件（決めた直後のものを除く）で、ドックで答える（at はドックでの位置）
const toDecide = () => items().flatMap((item, at) => (item.done ? [] : [{ ...item, at }]))

// --- 表示の言葉
const view = ship => {
  const status = S.ships[ship]
  if (!status) return { cls: 's-none', label: '未報告', note: '' }
  if (status.state === 'working') return { cls: 's-working', label: '作業中', note: status.doing }
  if (status.state === 'stuck') return { cls: 's-stuck', label: '詰まり', note: status.reason }
  if (status.state === 'waiting') return { cls: 's-waiting', label: '待機', note: `${NAME[status.on] ?? status.on} を待っている: ${status.what}` }
  return awaiting(ship, status, S.reviews[ship])
    ? { cls: 's-review', label: 'レビュー待ち', note: `${hhmm(status.since)} に収束` }
    : { cls: 's-converged', label: '収束', note: `${hhmm(status.since)} に収束` }
}
// 承認ボタンの文言。何を認めるのかを言う
const approveLabel = ship => (ship === 'qa' ? 'QA は十分と認める' : '承認する')
// 図は DB の文字列なので HTML として埋めない。SVG は画像で、それ以外は文字のまま出す
const fig = diagram => (diagram ? `<div class="fig">${/^\s*<svg\b/.test(diagram) ? svgImage(diagram) : `<pre class="sk">${mono(diagram)}</pre>`}</div>` : '')
const ordered = ask => [...ask.options.filter(o => o.id !== ask.recommended), ...ask.options.filter(o => o.id === ask.recommended)]

// --- 描画
// 画面は #<ship> か #<ship>.<サブページ>（hash に使えるのは英数字と . _ ~ - だけ）
const render = () => {
  const [hash, sub] = location.hash.slice(1).split('.')
  const ship = SHIPS.includes(hash) ? hash : ''
  const page = PAGES[ship] ? PAGES[ship].body(sub) : ship ? shipPage(ship) : glance()
  // 中身が同じなら作り直さない（作り直すと、開いた箇所・横スクロール・文字の選択が消える）
  if (page !== S.drawn) { S.drawn = page; $('glance').innerHTML = page }
  // coder の地図は自分で描く。ページの描き直しで作り直されたら、新しい要素に付け替える
  if ($('cmap')) { coderMap.setModel(S.model); coderMap.attach($('cmap')); coderMap.show(sub) }
  renderDock(ship, sub)
  renderSheet()
}
// DB を読めるまでの表示。読めたら空。db は claude.use が答えるまで undefined で、答えが null ならこの表示では読めない
const unready = () => (S.db === null ? `<p class="req wait">${esc(S.failed || 'この表示では fleet のデータを読めません。claude.ai で開いてください')}</p>`
  : !S.loaded ? '<p class="req wait">読み込み中</p>' : '')
// 状態の印。注意が要るものだけが面を持つのはパネルの役目で、印は形で見分ける
const glyph = cls => {
  const open = 'class="gly" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'
  if (cls === 's-converged') return `<svg ${open}><path d="m6.5 12.5 3.8 3.8 7.2-8.3" stroke="var(--muted)" stroke-width="2"/></svg>`

  const caret = typing && document.activeElement.selectionStart
  dock.innerHTML = html
  const rail = $('rail')
  if (!rail) return
  rail.scrollLeft = S.at * rail.clientWidth
  rail.addEventListener('scroll', onScroll, { passive: true })
  const field = typing && rail.querySelector(`[data-free="${CSS.escape(typing)}"]`)
  if (field) { field.focus({ preventScroll: true }); field.setSelectionRange(caret, caret) }
}
const slide = item => {
  if (item.done) {
    const left = Math.max(0, 5000 - (Date.now() - item.done.since))
    return `<div class="slide"><div class="dmsg">✓ ${esc(item.done.msg)}</div><div class="dsub">5 秒後に確定して、この件は消えます</div>${item.done.warn ? `<div class="warn">${esc(item.done.warn)}</div>` : ''}
      <div class="tbar"><div class="tfill" style="animation-delay:-${5000 - left}ms"></div></div><button class="undo" data-act="undo" data-key="${esc(item.key)}">取り消す</button></div>`
  }
  if (item.kind === 'review') {
    return `<div class="slide"><div class="rship">${NAME[item.ship]}</div><div class="dw">${hhmm(item.status.since)} に収束。構造と QA を確かめて承認する</div>
      <div class="acts"><a class="act" href="#${item.ship}"><span class="al">ページで見る ›</span></a><button class="act pri" data-act="approve" data-ship="${item.ship}"><span class="al">${approveLabel(item.ship)}</span></button></div></div>`
  }
  const ask = item.ask
  const question = `<button class="qbtn" data-act="open" data-ask="${esc(item.id)}"><span class="dq">${esc(ask.question)}</span></button>`
  const sentBefore = S.answers[item.id]
  if (sentBefore?.undelivered) {
    return `<div class="slide">${question}<div class="dw">回答「${esc(said(item.id, sentBefore))}」は flagship に届いていません（${esc(sentBefore.undelivered)}）</div>
      <div class="acts"><button class="act pri" data-act="resend" data-ask="${esc(item.id)}"><span class="al">flagship に送り直す</span></button></div></div>`
  }
  if (S.free === item.id) {
    return `<div class="slide">${question}<div class="acts"><textarea class="ft" data-free="${esc(item.id)}" maxlength="1000" aria-label="回答" placeholder="回答を書く">${esc(S.drafts[item.id])}</textarea>
      <div class="ftrow"><button class="fb" data-act="freeback">戻る</button><button class="fb pri" data-act="freesend" data-ask="${esc(item.id)}">この内容で送信</button></div></div></div>`
  }
  const opts = ordered(ask).map(o => `<button class="act${o.id === ask.recommended ? ' pri' : ''}" data-act="pick" data-ask="${esc(item.id)}" data-option="${esc(o.id)}">
    <span class="al">${esc(o.label)}${o.id === ask.recommended ? '<span class="atag">推奨</span>' : ''}</span><span class="ae">${esc(o.consequence)}</span></button>`).join('')
  return `<div class="slide">${question}<div class="acts">${opts}</div><div class="slk"><button data-act="open" data-ask="${esc(item.id)}">詳細</button><button data-act="free" data-ask="${esc(item.id)}">自由回答</button></div></div>`
}
// シートの中身: 付箋の中身か、開いた判断の詳細。どちらでもなければ空
const sheetHtml = () => {
  const peek = S.peek && peekSheet()
  if (peek) return peek
  const ask = S.asks[S.open]
  if (!ask) return ''
  const opts = ask.options.map(o => `<div class="opt2"><div class="ot">${esc(o.label)}${o.id === ask.recommended ? '<span class="otag">推奨</span>' : ''}</div>
    <div class="oc">${esc(o.consequence)}</div><div class="stxt">${esc(o.detail.text)}</div>${fig(o.detail.diagram)}</div>`).join('')
  const ev = ask.evaluation
  const table = ev ? `<div class="sec2"><div class="sh">評価表</div><div class="evw"><table class="ev">
    <tr><th class="ax">評価軸</th>${ask.options.map(o => `<th class="${o.id === ask.recommended ? 'rec' : ''}">${esc(o.label)}</th>`).join('')}</tr>
    ${ev.axes.map((axis, a) => `<tr><th class="ax">${esc(axis.name)}<span class="w">重み ${esc(axis.weight)}</span></th>${ask.options.map((o, k) => {
      const cell = ev.cells[k]?.[a] ?? {}
      return `<td class="${o.id === ask.recommended ? 'rec' : ''}"><span class="mk">${esc(cell.rating)}</span><span class="nt">${esc(cell.note)}</span></td>`
    }).join('')}</tr>`).join('')}</table></div></div>` : ''
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="判断の詳細"><div class="sbody gut"><div class="sq">${esc(ask.question)}</div>
    <div class="sec2"><div class="sh">背景</div><div class="stxt">${esc(ask.background.text)}</div>${fig(ask.background.diagram)}</div>
    <div class="sec2"><div class="sh">選択肢ごとの詳細</div>${opts}</div>${table}</div>
    <div class="sfoot gut"><button class="close" data-act="close">閉じる</button></div></div>`
}
const renderSheet = () => {
  const sheet = $('sheet')
  // コメントを打っている間は描き直さない（打った字が消えないように）
  if (S.peek && document.activeElement?.dataset?.free?.startsWith('c:') && !sheet.hidden) return
  const html = sheetHtml()
  sheet.hidden = !html
  // 中身が同じなら作り直さない（作り直すと、読んでいた位置が先頭に戻る）。閉じたら忘れるので、開き直すと先頭から
  if (html === S.sheetDrawn) return
  S.sheetDrawn = html
  if (html) sheet.innerHTML = html
}

// --- 操作
let lockTimer
const lockBriefly = () => {
  clearTimeout(lockTimer)
  S.locked = true
  $('rail')?.classList.add('locked')
  lockTimer = setTimeout(() => { S.locked = false; $('rail')?.classList.remove('locked') }, 250)
}
const onScroll = event => {
  const rail = event.currentTarget, at = Math.round(rail.scrollLeft / (rail.clientWidth || 1))
  lockBriefly()
  if (at === S.at) return
  S.at = at
  const list = items()
  document.querySelector('.navt').textContent = `${at + 1}/${list.length}`
  document.querySelectorAll('.arrow')[0].classList.toggle('off', at <= 0)
  document.querySelectorAll('.arrow')[1].classList.toggle('off', at >= list.length - 1)
}
const go = to => {
  const rail = $('rail')
  if (rail) rail.scrollTo({ left: Math.max(0, to) * rail.clientWidth, behavior: motion() ? 'smooth' : 'auto' })
}
const finish = (key, done) => {
  S.done[key] = Object.assign(done, { since: Date.now(), index: S.at })
  done.timer = setTimeout(() => { delete S.done[key]; lockBriefly(); render() }, 5000)
  render()
}
const reviewDoc = ship => S.db.doc(`${S.paths.reviews}/${ship}`)
const answerDoc = askId => S.db.doc(`${S.paths.answers}/${askId}`)
const clean = object => Object.fromEntries(Object.entries(object).filter(([, value]) => value !== undefined))
const fail = error => { S.failed = `書き込めませんでした（${error?.code ?? error}）。もう一度試してください`; render() }
// 送れたら、読み込んだときの「このビューからは送れない」を消す（送れるかどうかは後から変わる）
const delivered = () => { if (S.unsendable) { S.unsendable = ''; render() } }

const toggle = ship => {
  const review = S.reviews[ship] ?? {}
  reviewDoc(ship).set(clean({ ...review, required: !required(ship, review) })).catch(fail)
}
const approve = ship => {
  if (S.locked) return
  const item = yourTurn().find(i => i.kind === 'review' && i.ship === ship)
  const before = S.reviews[ship]
  reviewDoc(ship).set(clean({ ...before, approved_since: S.ships[ship].since })).catch(fail)
  if (!item) return
  finish(item.key, { item, msg: `${ship} を承認しました`, undo: () => (before ? reviewDoc(ship).set(before) : reviewDoc(ship).delete()).catch(fail) })
}
// 判断の回答: DB に書き、コメントで flagship に送る（送れるのはタップの直後だけ）
const answer = async (askId, body, msg, says, button) => {
  if (S.locked) return
  const item = yourTurn().find(i => i.key === `ask:${askId}`)
  if (!item) return
  const anchor = S.comments ? await S.comments.anchorFor(button).catch(() => null) : null
  const done = { item, msg, warn: '', thread: null, undone: false }
  S.free = null
  finish(item.key, done)
  // 同じ文書への書き込みは前のが済んでから（db.d.ts）。取り消しの削除も「届いていない」の印も、この回答の書き込みに続ける
  let writing = answerDoc(askId).set(body).catch(fail)
  const write = next => { writing = writing.then(next).catch(fail) }
  const withdraw = thread => S.comments.sendToClaude({ threadId: thread, text: `判断 ${askId} の回答を取り消します` }).catch(() => {})
  done.undo = () => {
    done.undone = true
    write(() => answerDoc(askId).delete())
    if (done.thread) withdraw(done.thread)
  }
  const text = `判断 ${askId}「${S.asks[askId].question}」に${says}`
  const sent = anchor ? await S.comments.sendToClaude({ anchor, text }).catch(error => ({ error })) : { error: { code: 'not_granted' } }
  // 送っている間に取り消していたら、届いた回答にだけ取り消しを送り、届かなかった印は書かない
  if (sent.threadId) {
    delivered()
    if (done.undone) withdraw(sent.threadId)
    else done.thread = sent.threadId
    return
  }
  if (done.undone) return
  const code = sent.error?.code ?? 'unknown'
  done.warn = `flagship には届いていません（${code}）。回答は記録しました`
  S.failed = `判断の回答を flagship に送れませんでした（${code}）`
  write(() => answerDoc(askId).set({ ...body, undelivered: code }))
  render()
}
const pick = (askId, optionId, button) => {
  const option = S.asks[askId].options.find(o => o.id === optionId)
  return answer(askId, { choice: optionId }, `「${option.label}」で決めました`, `「${option.label}」（${optionId}）と答えました`, button)
}
const sendFree = (askId, button) => {
  const text = (S.drafts[askId] ?? '').trim()
  if (!text) return document.querySelector(`[data-free="${CSS.escape(askId)}"]`)?.focus()
  return answer(askId, { text }, `自由記述で回答しました「${text.length > 40 ? `${text.slice(0, 40)}…` : text}」`, `自由記述で答えました:\n${text}`, button)
}
// 回答の中身を、flagship に送る文にする
const said = (askId, body) => (body.text !== undefined ? `自由記述: ${body.text}` : `${S.asks[askId].options.find(o => o.id === body.choice)?.label ?? body.choice}（${body.choice}）`)
// 届かなかった回答を送り直す（送れるのはタップの直後だけ）
const resend = async (askId, button) => {
  const body = S.answers[askId]
  const anchor = S.comments ? await S.comments.anchorFor(button).catch(() => null) : null
  const sent = anchor ? await S.comments.sendToClaude({ anchor, text: `判断 ${askId}「${S.asks[askId].question}」に答えました: ${said(askId, body)}` }).catch(error => ({ error })) : { error: { code: 'not_granted' } }
  const { undelivered, ...answer } = body
  if (sent.threadId) { S.failed = ''; delivered(); answerDoc(askId).set(answer).catch(fail); return }
  S.failed = `判断の回答を flagship に送れませんでした（${sent.error?.code ?? 'unknown'}）。ページを再読み込みすると、送信の許可をもう一度聞かれます`
  render()
}
const undo = key => {
  const done = S.done[key]
  if (!done) return
  clearTimeout(done.timer)
  delete S.done[key]
  done.undo()
  render()
}
document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]')
  if (!el) return
  const { act, ship, ask, option, to, key } = el.dataset
  if (act === 'toggle') toggle(ship)
  if (act === 'approve') approve(ship)
  if (act === 'pick') pick(ask, option, el)
  if (act === 'free' && !S.locked) { S.free = ask; render(); document.querySelector(`[data-free="${CSS.escape(ask)}"]`)?.focus() }
  if (act === 'freeback') { S.free = null; render() }
  if (act === 'freesend') sendFree(ask, el)
  if (act === 'resend') resend(ask, el)
  if (act === 'undo') undo(key)
  if (act === 'go') go(Number(to))
  if (act === 'jump') $(to)?.scrollIntoView({ behavior: motion() ? 'smooth' : 'auto' })
  if (act === 'open' && !S.locked) { S.open = ask; renderSheet() }
  if (act === 'close') { S.open = null; S.peek = null; renderSheet() }
  if (act === 'peek') { S.peek = el.dataset.peek; S.remarked = ''; renderSheet() }
  if (act === 'remark') remark(ship, el.dataset.key, el)
  if (act === 'resolve') resolveThread(el.dataset.id)
})
document.addEventListener('input', event => { if (event.target.dataset.free) S.drafts[event.target.dataset.free] = event.target.value })
addEventListener('hashchange', () => { $('glance').scrollTop = 0; S.peek = null; render() })

// --- DB を読む
// 読めなくなった購読は止まる（db.d.ts）。どの購読でも同じく、読めないと出す
const unreadable = error => { S.failed = `fleet のデータを読めません（${error.code}）`; S.db = null; render() }
const listen = (path, apply) => S.db.collection(path).onSnapshot(snap => {
  apply(Object.fromEntries(snap.docs.map(doc => [doc.id, doc.data()])))
  S.loaded = true
  render()
}, unreadable)
const start = async () => {
  S.db = (await window.claude?.use('db')) ?? null
  if (!S.db) return render()
  S.comments = await claude.use('comments')
  const canSend = S.comments ? await S.comments.canSendToClaude().catch(error => error?.code ?? 'error') : 'comments なし'
  if (canSend !== 'available') S.unsendable = `このビューからは判断の回答を flagship に送れません（${canSend}）`
  const where = await S.db.doc('fleet/db-paths').get().catch(() => null)
  if (!where?.exists) { S.failed = 'DB の置き場所（fleet/db-paths）がまだありません。flagship がこのページを publish し直すと置かれます'; S.db = null; return render() }
  S.paths = where.data()
  S.db.doc(S.paths.brief).onSnapshot(snap => { S.brief = snap.data()?.brief; S.problems = snap.data()?.problems ?? []; render() }, unreadable)
  listen(S.paths.ships, docs => { S.ships = Object.fromEntries(SHIPS.filter(ship => docs[ship]).map(ship => [ship, docs[ship]])) })
  listen(S.paths.asks, docs => { S.asks = docs })
  listen(S.paths.decisions, docs => { S.decisions = Object.entries(docs).map(([id, d]) => ({ id, ...d })).sort((a, b) => String(b.at).localeCompare(String(a.at))) })
  S.db.doc(S.paths.remaining).onSnapshot(snap => { S.remaining = snap.data()?.chunks ?? null; render() }, unreadable)
  listen(S.paths.answers, docs => { S.answers = docs })
  listen(S.paths.reviews, docs => { S.reviews = docs })
  S.db.doc(S.paths.requirements).onSnapshot(snap => { S.requirements = snap.data()?.requirements ?? []; render() }, unreadable)
  S.db.doc(S.paths.behavior).onSnapshot(snap => { S.behavior = { moments: [], views: [], readModels: [], flows: [], hotspots: [], ...snap.data() }; render() }, unreadable)
  listen(S.paths.behaviorJournal, docs => { S.journal = Object.values(docs).sort((a, b) => String(b.at).localeCompare(String(a.at))) })
  listen(S.paths.behaviorReplies, docs => { S.replies = docs })
  listen(S.paths.comments, docs => { S.threads = docs })
  S.db.doc(S.paths.model).onSnapshot(snap => { S.model = snap.data() ?? null; render() }, unreadable)
  S.db.doc(S.paths.quality).onSnapshot(snap => { S.quality = { checks: [], findings: [], charters: [], ...snap.data() }; render() }, unreadable)
  listen(S.paths.links, docs => { S.links = docs })
  ;['guide', 'unaskedSpecs', 'operationsDesign'].forEach(name => S.db.doc(S.paths[name]).onSnapshot(snap => { S.documents[name] = snap.data(); render() }, unreadable))
}
render()
start()
</script>
