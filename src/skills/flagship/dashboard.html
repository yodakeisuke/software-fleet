<title>Software Fleet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 1 列のスマホ画面: 上がスクロールする一覧（判断すること・残り・ships・決めたこと）、下が親指で操作するドック（あなたの番） */
:root{
  --bg:oklch(0.97 0.008 75);--surface:oklch(0.995 0.003 75);--fg:oklch(0.24 0.012 60);--muted:oklch(0.5 0.012 60);
  --line:oklch(0.88 0.01 70);--acc:oklch(0.56 0.14 40);--on-acc:oklch(0.99 0.003 75);
  --work:oklch(0.55 0.13 250);--review:oklch(0.62 0.14 75);--done:oklch(0.56 0.13 150);--stuck:oklch(0.55 0.17 25);--wait:oklch(0.78 0.01 60);
  --shadow:oklch(0 0 0 / .08);--scrim:oklch(0 0 0 / .35);
  --font:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:oklch(0.18 0.008 60);--surface:oklch(0.23 0.009 60);--fg:oklch(0.94 0.008 75);--muted:oklch(0.72 0.012 60);
  --line:oklch(0.33 0.01 60);--acc:oklch(0.72 0.13 45);--on-acc:oklch(0.18 0.01 60);
  --work:oklch(0.72 0.12 250);--review:oklch(0.8 0.13 75);--done:oklch(0.74 0.13 150);--stuck:oklch(0.7 0.16 25);--wait:oklch(0.42 0.01 60);
  --shadow:oklch(0 0 0 / .3);--scrim:oklch(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.18 0.008 60);--surface:oklch(0.23 0.009 60);--fg:oklch(0.94 0.008 75);--muted:oklch(0.72 0.012 60);
  --line:oklch(0.33 0.01 60);--acc:oklch(0.72 0.13 45);--on-acc:oklch(0.18 0.01 60);
  --work:oklch(0.72 0.12 250);--review:oklch(0.8 0.13 75);--done:oklch(0.74 0.13 150);--stuck:oklch(0.7 0.16 25);--wait:oklch(0.42 0.01 60);
  --shadow:oklch(0 0 0 / .3);--scrim:oklch(0 0 0 / .5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glance{flex:1;min-height:0;overflow-y:auto;padding-block:18px 12px;display:flex;flex-direction:column;gap:10px}
.req{margin:0;font-size:14px;line-height:1.5;font-weight:700;text-wrap:balance}
.req.wait{color:var(--muted);font-weight:400}
.h2{font-size:14px;font-weight:700}
.cnt{font-size:12px;color:var(--muted)}
.ships{display:flex;flex-direction:column}
.shiph{display:flex;align-items:baseline;gap:8px;padding-bottom:6px}
.legend{margin-left:auto;font-size:11px;color:var(--muted)}
.ship{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sr{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--wait)}
.s-working{background:var(--work)}.s-review{background:var(--review)}.s-converged{background:var(--done)}.s-stuck{background:var(--stuck)}.s-waiting,.s-none{background:var(--wait)}
.sname{font-size:13px;font-weight:700}
.st{font-size:11.5px;color:var(--muted)}
.go{margin-left:auto;font-size:18px;line-height:1;color:var(--muted)}
.snote{font-size:11.5px;line-height:1.5;color:var(--muted);padding-left:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{flex:none;width:52px;height:44px;display:flex;align-items:center;justify-content:center}
.trk{position:relative;width:40px;height:24px;border-radius:999px;background:var(--line)}
.knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on .trk{background:var(--fg)}
.sw.on .knob{left:19px}
/* あなたが判断すること・残りの塊: 一覧で見渡し、押すとドックのその件・ship のページへ */
.yt{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 0;border-top:1px solid var(--line)}
.ytk{flex:none;width:52px;text-align:center;font-size:10.5px;font-weight:700;line-height:18px;border-radius:999px}
.k-ask{background:var(--acc);color:var(--on-acc)}
.k-review{background:color-mix(in oklch,var(--review) 35%,transparent);color:var(--fg)}
.k-wait{box-shadow:inset 0 0 0 1.5px var(--fg)}
.ytt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.45;font-weight:700}
.ytt>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ytt small{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lfn{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.lfn.on{background:var(--acc);color:var(--on-acc);box-shadow:none}
.lfb{display:flex;flex-direction:column;min-width:0}
.lft{font-size:13px;line-height:1.55;font-weight:700;padding-top:1px;overflow-wrap:anywhere}
.lfw{display:flex;align-items:center;min-height:36px;max-width:100%;font-size:11.5px;font-weight:700;color:var(--acc)}
.lfw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log summary{cursor:pointer;font-size:13px;font-weight:700;list-style:none;display:flex;align-items:center;min-height:44px;gap:8px}
.log summary::-webkit-details-marker{display:none}
.log summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px}
.logi{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.lt{font-size:13px;font-weight:700}
.lw{font-size:12px;color:var(--muted)}
.dock{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -10px 24px var(--shadow)}
.nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 8px}
.arrow{width:48px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center}
.arrow.off{opacity:.25;pointer-events:none}
.navc{display:flex;flex-direction:column;align-items:center;gap:4px}
.navt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.navt b{color:var(--acc)}
.dots{display:flex;align-items:center}
.dotb{width:24px;height:20px;display:flex;align-items:center;justify-content:center}
.dotb span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dotb.on span{width:18px;border-radius:4px;background:var(--fg)}
.rail{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;align-items:stretch}
.rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.qbtn{display:flex;flex-direction:column;gap:2px;width:100%;min-height:44px}
.dq{font-size:15px;line-height:1.45;font-weight:700;text-wrap:pretty}
.more{font-size:12px;font-weight:700;color:var(--acc)}
.dw{font-size:12px;line-height:1.6;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:2px}
.act{display:flex;flex-direction:column;justify-content:center;gap:1px;width:100%;min-height:48px;padding:5px 14px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);transition:opacity .12s;min-width:0}
.act.pri{background:var(--acc);color:var(--on-acc);box-shadow:none}
.act.free{min-height:44px;flex-direction:row;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700}
.act.free span{border-bottom:1px dashed currentColor}
.locked .act,.locked .qbtn{pointer-events:none}
.locked .act{opacity:.55}
.al{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;line-height:1.3;min-width:0}
.ae{font-size:11px;line-height:1.35;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atag{flex:none;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--on-acc);color:var(--acc)}
.ft{width:100%;min-height:96px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;line-height:1.5;resize:none}
.ft:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.ftrow{display:grid;grid-template-columns:96px 1fr;gap:8px}
.fb{min-height:48px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.fb.pri{background:var(--acc);color:var(--on-acc);box-shadow:none}
.rship{font-size:20px;font-weight:700}
.dmsg{font-size:15px;font-weight:700;line-height:1.5;word-break:break-all}
.dsub{font-size:12px;color:var(--muted)}
.warn{font-size:12px;line-height:1.5;color:var(--stuck)}
.undo{min-height:52px;border-radius:14px;box-shadow:inset 0 0 0 2px var(--fg);font-size:15px;font-weight:700;text-align:center;margin-top:auto}
.tbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.tfill{height:100%;background:var(--fg);transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.dnone{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.dnone .cnt{margin-left:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{height:90%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;overflow:hidden}
.sbody{flex:1;min-height:0;overflow-y:auto;padding-block:18px 12px;display:flex;flex-direction:column;gap:14px}
.sq{font-size:16px;line-height:1.5;font-weight:700}
.sec2{display:flex;flex-direction:column;gap:8px}
.sh{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc)}
.stxt{font-size:13px;line-height:1.7;text-wrap:pretty;white-space:pre-wrap}
.fig{max-width:100%;overflow-x:auto;border-radius:12px}
.fig svg{max-width:100%;height:auto}
.opt2{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-width:0}
.ot{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.otag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--on-acc)}
.oc{font-size:12px;color:var(--muted)}
.evw{overflow-x:auto}
.ev{width:100%;table-layout:fixed;border-collapse:collapse;font-size:11px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ev th,.ev td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.35;word-break:break-all}
.ev .ax{width:70px}
.ev .rec{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.w{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}
.mk{display:block;font-size:15px;font-weight:700;line-height:1.2}
.nt{display:block;color:var(--muted);font-size:10.5px}
.sfoot{flex:none;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.close{width:100%;min-height:52px;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:700;text-align:center}
.back{font-size:13px;font-weight:700;color:var(--acc);min-height:44px;display:flex;align-items:center}
.big{font-size:20px;font-weight:700}
/* requirement: 要求を 1 文で読む。印は別の列に置き、折り返しても文の左端をそろえる。文節で折り返す（lang="ja" が要る） */
.rhead{display:flex;align-items:center;gap:6px;min-height:44px;font-size:16px;font-weight:700}
.rhead span{font-size:20px;font-weight:400;color:var(--muted)}
.rkh{position:sticky;top:-18px;z-index:1;background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--acc);padding:12px 0 5px;border-bottom:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.rmk{width:20px;height:18px;margin-top:3px;border-radius:5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--fg)}
.rmk.new{background:var(--acc);color:var(--on-acc);box-shadow:none}
.rbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.rsen,.ract,.rev{margin:0;text-wrap:pretty;word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.rsen{font-size:14px;line-height:1.65}
.rflow{display:flex;flex-direction:column;gap:1px;padding-top:6px;border-top:1px dashed var(--line)}
.rflow:first-of-type{border-top:0;padding-top:0}
.ract{font-size:12.5px;line-height:1.55;color:var(--muted)}
.rev{display:grid;grid-template-columns:16px minmax(0,1fr);font-size:13px;line-height:1.55;font-weight:700}
.rev span:first-child{color:var(--acc)}
.rdock{display:flex;flex-direction:column;gap:8px}
.rgist{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;line-height:1.55;margin-bottom:4px}
.rgist th{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:left;padding:0 0 4px}
.rgist td{vertical-align:top;padding:7px 10px 7px 0;border-top:1px solid var(--line);text-wrap:pretty;word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.rgist td+td{padding-right:0;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:12px;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.seg a{min-height:40px;border-radius:9px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.seg a[aria-current]{background:var(--fg);color:var(--bg)}
/* cs: ガイドはドックの上までを埋め、iframe の中でスクロールする。画面の端まで広げる */
.glance:has(> .guide){overflow:hidden}
.guide{flex:1;min-height:0;border:0;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
@media (prefers-reduced-motion:reduce){.tfill{animation:none}.knob,.act{transition:none}}
</style>

<div class="app" id="app" lang="ja">
  <main class="glance gut" id="glance"><p class="req wait">読み込み中</p></main>
  <section class="dock" id="dock" aria-label="あなたの番"></section>
  <div class="scrim" id="sheet" hidden></div>
</div>

<script>
// 状態は DB だけが持つ。ページは onSnapshot で描き直し、ユーザ操作（要レビュー・承認・判断の回答・ship への返事）だけを answers・reviews・comments に書く
// 文書の置き場所は fleet/fleet-db.ts が唯一の定義で、mod が publish のときに DB の fleet/db-paths に置く。ページはそれを読む（知っているのはその 1 つだけ）
// 写しの例外: ビルドせずに publish するので、required・レビュー待ちの規則は src/fleet/logic/review.ts の写しを持つ。review を変えたらここも直す
const SHIPS = ['requirement', 'behavior', 'code-design', 'implementation', 'qa', 'cs', 'security', 'ops']
const S = { paths: null, db: undefined, comments: null, loaded: false, fleet: {}, ships: {}, asks: {}, decisions: [], answers: {}, reviews: {}, requirements: [], threads: {}, problems: [], guide: null, remaining: null, at: 0, locked: false, done: {}, open: null, free: null, drafts: {}, failed: '' }
const $ = id => document.getElementById(id)
const esc = text => String(text ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const hhmm = iso => (iso ? new Date(iso).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '')
const motion = () => !matchMedia('(prefers-reduced-motion: reduce)').matches

// --- 導出
const required = (ship, review) => review?.required ?? ['code-design', 'qa'].includes(ship)
const awaiting = (ship, status, review) => status.state === 'converged' && required(ship, review) && review?.approved_since !== status.since
const yourTurn = () => {
  const closed = new Set(S.decisions.map(d => d.closes))
  // 回答済みでも flagship に届いていない判断は残し、送り直せるようにする
  const asks = Object.entries(S.asks).filter(([id]) => (!(id in S.answers) || S.answers[id].undelivered) && !closed.has(id))
    .sort(([, a], [, b]) => String(a.at).localeCompare(String(b.at))).map(([id, ask]) => ({ kind: 'ask', key: `ask:${id}`, id, ask }))
  const reviews = SHIPS.filter(ship => S.ships[ship] && awaiting(ship, S.ships[ship], S.reviews[ship]))
    .map(ship => ({ kind: 'review', key: `review:${ship}:${S.ships[ship].since}`, ship, status: S.ships[ship] }))
  // あなたを待っている ship。返事が flagship に届くまで残す
  const waits = SHIPS.filter(ship => S.ships[ship]?.state === 'waiting' && S.ships[ship].on === 'user' && !replied(ship))
    .map(ship => ({ kind: 'waiting', key: `waiting:${ship}:${S.ships[ship].since}`, ship, status: S.ships[ship] }))
  return [...asks, ...reviews, ...waits]
}
// 今の待ちへの返事（コメントの [id, 中身]）。待ちは報告した時刻で見分ける
const replyOf = ship => Object.entries(S.threads).find(([, t]) => t.ship === ship && t.on === `w:${S.ships[ship].since}`)
const replied = ship => { const reply = replyOf(ship); return reply !== undefined && !reply[1].undelivered }
// 決めた直後の件は、5 秒間その場に「取り消す」として残す
const items = () => {
  const list = yourTurn().filter(item => !(item.key in S.done))
  Object.values(S.done).sort((a, b) => a.index - b.index).forEach(d => list.splice(Math.min(d.index, list.length), 0, { ...d.item, done: d }))
  return list
}
// あなたが判断することの全部。判断・レビュー待ち・ship への返事はドックで答える（at はドックでの位置）
const toDecide = () => {
  const list = items()
  return yourTurn().map(item => ({ ...item, at: list.findIndex(i => i.key === item.key) }))
}
const KIND = { ask: '判断', review: 'レビュー', waiting: '返事' }

// --- 表示の言葉
const view = ship => {
  const status = S.ships[ship]
  if (!status) return { cls: 's-none', label: '未報告', note: '' }
  if (status.state === 'working') return { cls: 's-working', label: '作業中', note: status.doing }
  if (status.state === 'stuck') return { cls: 's-stuck', label: '詰まり', note: status.reason }
  if (status.state === 'waiting') return { cls: 's-waiting', label: '待機', note: `${status.on === 'user' ? 'あなた' : status.on} を待っている: ${status.what}` }
  return awaiting(ship, status, S.reviews[ship])
    ? { cls: 's-review', label: 'レビュー待ち', note: `${hhmm(status.since)} に収束` }
    : { cls: 's-converged', label: '収束', note: `${hhmm(status.since)} に収束` }
}
const fig = html => (html ? `<div class="fig">${html}</div>` : '')
const ordered = ask => [...ask.options.filter(o => o.id !== ask.recommended), ...ask.options.filter(o => o.id === ask.recommended)]

// --- 描画
// 画面は #<ship> か #<ship>.<サブページ>（hash に使えるのは英数字と . _ ~ - だけ）
const render = () => {
  const [hash, sub] = location.hash.slice(1).split('.')
  const ship = SHIPS.includes(hash) ? hash : ''
  if (ship === 'cs') renderCs(sub)

// --- 操作
let lockTimer
const lockBriefly = () => {
  clearTimeout(lockTimer)
  S.locked = true
  $('rail')?.classList.add('locked')
  lockTimer = setTimeout(() => { S.locked = false; $('rail')?.classList.remove('locked') }, 250)
}
const onScroll = event => {
  const rail = event.currentTarget, at = Math.round(rail.scrollLeft / (rail.clientWidth || 1))
  lockBriefly()
  if (at === S.at) return
  S.at = at
  document.querySelectorAll('.dotb').forEach((dot, k) => dot.classList.toggle('on', k === at))
  const list = items()
  document.querySelector('.navt').innerHTML = `<b>${KIND[list[at]?.kind] ?? ''}</b> · ${at + 1} / ${list.length}`
  document.querySelectorAll('.arrow')[0].classList.toggle('off', at <= 0)
  document.querySelectorAll('.arrow')[1].classList.toggle('off', at >= list.length - 1)
}
const go = to => {
  const rail = $('rail')
  if (rail) rail.scrollTo({ left: Math.max(0, to) * rail.clientWidth, behavior: motion() ? 'smooth' : 'auto' })
}
const finish = (key, done) => {
  S.done[key] = Object.assign(done, { since: Date.now(), index: S.at })
  done.timer = setTimeout(() => { delete S.done[key]; lockBriefly(); render() }, 5000)
  render()
}
const reviewDoc = ship => S.db.doc(`${S.paths.reviews}/${ship}`)
const answerDoc = askId => S.db.doc(`${S.paths.answers}/${askId}`)
const clean = object => Object.fromEntries(Object.entries(object).filter(([, value]) => value !== undefined))

  const review = S.reviews[ship] ?? {}

}

  if (S.locked) return
  const item = yourTurn().find(i => i.kind === 'review' && i.ship === ship)
  const before = S.reviews[ship]
  reviewDoc(ship).set(clean({ ...before, approved_since: S.ships[ship].since })).catch(fail)
  if (!item) return
  finish(item.key, { item, msg: `${ship} を承認しました`, undo: () => (before ? reviewDoc(ship).set(before) : reviewDoc(ship).delete()).catch(fail) })

// 判断の回答: DB に書き、コメントで flagship に送る（送れるのはタップの直後だけ）
const answer = async (askId, body, msg, says, button) => {
  if (S.locked) return
  const item = yourTurn().find(i => i.key === `ask:${askId}`)
  if (!item) return
  const anchor = S.comments ? await S.comments.anchorFor(button).catch(() => null) : null
  const done = { item, msg, warn: '', thread: null }
  done.undo = () => {
    answerDoc(askId).delete().catch(fail)
    if (done.thread) S.comments.sendToClaude({ threadId: done.thread, text: `判断 ${askId} の回答を取り消します` }).catch(() => {})
  }
  S.free = null
  finish(item.key, done)
  answerDoc(askId).set(body).catch(fail)
  const text = `判断 ${askId}「${S.asks[askId].question}」に${says}`
  const sent = anchor ? await S.comments.sendToClaude({ anchor, text }).catch(error => ({ error })) : { error: { code: 'not_granted' } }
  if (sent.threadId) done.thread = sent.threadId
  else {
    const code = sent.error?.code ?? 'unknown'
    done.warn = `flagship には届いていません（${code}）。回答は記録しました`
    S.failed = `判断の回答を flagship に送れませんでした（${code}）`
    answerDoc(askId).set({ ...body, undelivered: code }).catch(fail)
    render()
  }
}

const sendFree = (askId, button) => {
  const text = (S.drafts[askId] ?? '').trim()
  if (!text) return document.querySelector(`[data-free="${CSS.escape(askId)}"]`)?.focus()
  return answer(askId, { text }, `自由記述で回答しました「${text.length > 40 ? `${text.slice(0, 40)}…` : text}」`, `自由記述で答えました:\n${text}`, button)
}

// 届かなかった回答を送り直す（送れるのはタップの直後だけ）
const resend = async (askId, button) => {
  const body = S.answers[askId]
  const anchor = S.comments ? await S.comments.anchorFor(button).catch(() => null) : null
  const sent = anchor ? await S.comments.sendToClaude({ anchor, text: `判断 ${askId}「${S.asks[askId].question}」に答えました: ${said(askId, body)}` }).catch(error => ({ error })) : { error: { code: 'not_granted' } }
  const { undelivered, ...answer } = body
  if (sent.threadId) { S.failed = ''; answerDoc(askId).set(answer).catch(fail); return }
  S.failed = `判断の回答を flagship に送れませんでした（${sent.error?.code ?? 'unknown'}）。ページを再読み込みすると、送信の許可をもう一度聞かれます`

// ship への返事: コメントとして DB に書き、flagship に送る（送れるのはタップの直後だけ）。flagship がその ship に回す
const commentDoc = id => S.db.doc(`${S.paths.comments}/${id}`)
const anchorOf = button => (S.comments ? S.comments.anchorFor(button).catch(() => null) : Promise.resolve(null))
const toFlagship = (anchor, text) => (anchor ? S.comments.sendToClaude({ anchor, text }).catch(error => ({ error })) : Promise.resolve({ error: { code: 'not_granted' } }))
const relay = (ship, id, reply) => `${ship} の待ち「${S.ships[ship].what}」へのユーザの返事（id: ${id}）。${ship} に回してください:\n${reply.text}`
const replyTo = async (ship, button) => {
  if (S.locked) return
  const item = yourTurn().find(i => i.kind === 'waiting' && i.ship === ship)
  if (!item) return
  const text = (S.drafts[item.key] ?? '').trim()
  if (!text) return document.querySelector(`[data-free="${CSS.escape(item.key)}"]`)?.focus()
  const anchor = await anchorOf(button)
  const id = `comment-${Date.now()}`, reply = { ship, on: `w:${item.status.since}`, text, at: new Date().toISOString() }
  const done = { item, msg: `${ship} に返事を送りました`, warn: '', thread: null }
  done.undo = () => {
    commentDoc(id).delete().catch(fail)
    if (done.thread) S.comments.sendToClaude({ threadId: done.thread, text: `${ship} への返事（id: ${id}）を取り消します` }).catch(() => {})
  }
  document.activeElement?.blur()
  finish(item.key, done)
  commentDoc(id).set(reply).catch(fail)
  const sent = await toFlagship(anchor, relay(ship, id, reply))
  if (sent.threadId) { done.thread = sent.threadId; return }
  const code = sent.error?.code ?? 'unknown'
  done.warn = `flagship には届いていません（${code}）。返事は記録しました`
  S.failed = `${ship} への返事を flagship に送れませんでした（${code}）`
  commentDoc(id).set({ ...reply, undelivered: code }).catch(fail)
  render()
}
// 届かなかった返事を送り直す
const rereply = async (ship, button) => {
  const found = replyOf(ship)
  if (!found) return
  const [id, { undelivered, ...reply }] = found
  const sent = await toFlagship(await anchorOf(button), relay(ship, id, reply))
  if (sent.threadId) { S.failed = ''; commentDoc(id).set(reply).catch(fail); return }
  S.failed = `${ship} への返事を flagship に送れませんでした（${sent.error?.code ?? 'unknown'}）。ページを再読み込みすると、送信の許可をもう一度聞かれます`
  render()
}
const undo = key => {
  const done = S.done[key]
  if (!done) return
  clearTimeout(done.timer)
  delete S.done[key]
  done.undo()
  render()
}
document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]')
  if (!el) return
  const { act, ship, ask, option, to, key } = el.dataset
  if (act === 'toggle') toggle(ship)
  if (act === 'approve') approve(ship)
  if (act === 'pick') pick(ask, option, el)
  if (act === 'free' && !S.locked) { S.free = ask; render(); document.querySelector(`[data-free="${CSS.escape(ask)}"]`)?.focus() }
  if (act === 'freeback') { S.free = null; render() }
  if (act === 'freesend') sendFree(ask, el)
  if (act === 'resend') resend(ask, el)
  if (act === 'reply') replyTo(ship, el)
  if (act === 'rereply') rereply(ship, el)
  if (act === 'undo') undo(key)
  if (act === 'go') go(Number(to))
  if (act === 'open' && !S.locked) { S.open = ask; renderSheet() }
  if (act === 'close') { S.open = null; renderSheet() }
})
document.addEventListener('input', event => { if (event.target.dataset.free) S.drafts[event.target.dataset.free] = event.target.value })
addEventListener('hashchange', render)

// --- DB を読む
const listen = (path, apply) => S.db.collection(path).onSnapshot(snap => {
  apply(Object.fromEntries(snap.docs.map(doc => [doc.id, doc.data()])))
  S.loaded = true
  render()
}, error => { S.failed = `fleet のデータを読めません（${error.code}）`; S.db = null; render() })
const start = async () => {
  S.db = (await window.claude?.use('db')) ?? null
  if (!S.db) return render()
  S.comments = await claude.use('comments')
  const canSend = S.comments ? await S.comments.canSendToClaude().catch(error => error?.code ?? 'error') : 'comments なし'
  if (canSend !== 'available') S.failed = `このビューからは判断の回答を flagship に送れません（${canSend}）`
  const where = await S.db.doc('fleet/db-paths').get().catch(() => null)
  if (!where?.exists) { S.failed = 'DB の置き場所（fleet/db-paths）がまだありません。flagship がこのページを publish し直すと置かれます'; S.db = null; return render() }
  S.paths = where.data()
  S.db.doc(S.paths.brief).onSnapshot(snap => { S.brief = snap.data()?.brief; S.problems = snap.data()?.problems ?? []; render() }, () => {})
  listen(S.paths.ships, docs => { S.ships = Object.fromEntries(SHIPS.filter(ship => docs[ship]).map(ship => [ship, docs[ship]])) })
  listen(S.paths.asks, docs => { S.asks = docs })
  listen(S.paths.decisions, docs => { S.decisions = Object.values(docs).sort((a, b) => String(b.at).localeCompare(String(a.at))) })
  S.db.doc(S.paths.remaining).onSnapshot(snap => { S.remaining = snap.data()?.chunks ?? null; render() }, () => {})
  listen(S.paths.answers, docs => { S.answers = docs })
  listen(S.paths.reviews, docs => { S.reviews = docs })
  S.db.doc(S.paths.requirements).onSnapshot(snap => { S.requirements = snap.data()?.requirements ?? []; render() }, () => {})
  S.db.doc(S.paths.guide).onSnapshot(snap => { S.guide = snap.data() ?? null; render() }, () => {})
  listen(S.paths.comments, docs => { S.threads = docs })
}
render()
start()
</script>
